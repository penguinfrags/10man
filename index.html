<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CS2 Pickup Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg0: #05080f;
    --bg1: #090e18;
    --bg2: #0e1623;
    --bg3: #141e2e;
    --bg4: #1a2640;
    --border: #1e2d42;
    --border2: #243450;
    --text: #dde6f0;
    --muted: #5a7080;
    --muted2: #3a5060;
    --red: #e53e3e;
    --red-dim: #7a1f1f;
    --blue: #4299e1;
    --blue-dim: #1a3060;
    --green: #48bb78;
    --amber: #ecc94b;
    --purple: #b794f4;
    --font: 'Rajdhani', sans-serif;
    --mono: 'Share Tech Mono', monospace;
  }

  html, body { height: 100%; background: var(--bg0); color: var(--text); font-family: var(--font); overflow: hidden; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── Header ── */
  #header {
    display: flex; align-items: center; gap: 16px;
    padding: 0 28px; height: 56px;
    background: var(--bg1);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { font-size: 22px; font-weight: 800; color: var(--red); letter-spacing: 4px; }
  .logo-sep { color: var(--border2); font-size: 18px; }
  .logo-title { font-size: 17px; font-weight: 600; letter-spacing: 2px; color: var(--text); }
  #header-stats { margin-left: auto; color: var(--muted); font-size: 13px; font-family: var(--mono); }

  /* ── Nav ── */
  #nav {
    display: flex; background: var(--bg1);
    border-bottom: 1px solid var(--border);
    padding: 0 28px; flex-shrink: 0;
  }
  .nav-btn {
    padding: 13px 20px; background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer;
    font-family: var(--font); font-weight: 700; font-size: 13px; letter-spacing: 2px;
    transition: color .15s, border-color .15s;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--text); border-bottom-color: var(--red); }

  /* ── Main content ── */
  #content { flex: 1; overflow-y: auto; padding: 28px; }

  /* ── Scrollbar ── */
  #content::-webkit-scrollbar { width: 6px; }
  #content::-webkit-scrollbar-track { background: var(--bg1); }
  #content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── Flash ── */
  #flash {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 10px; padding: 10px 22px;
    color: var(--text); font-size: 14px; font-weight: 600; letter-spacing: .5px;
    z-index: 9999; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Modal overlay ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 9000;
  }
  .modal-box {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 16px; padding: 28px;
    width: min(480px, 95vw); max-height: 90vh; overflow-y: auto;
  }
  .modal-title { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .modal-title h3 { color: var(--text); font-size: 16px; }
  .modal-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── Cards ── */
  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px 26px;
    transition: border-color .15s;
  }
  .card.clickable:hover { border-color: var(--border2); cursor: pointer; }
  .card.in-lobby { background: #0f1e10; border-color: #1e4020; }
  .card.in-lobby:hover { border-color: #2a5a2a; }

  /* ── Player card ── */
  .player-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .player-name { font-size: 24px; font-weight: 700; color: var(--text); }
  .player-role { font-size: 16px; color: var(--muted); margin-top: 2px; }
  .player-rank-label { font-size: 17px; font-weight: 700; }
  .player-rank-val { font-size: 14px; color: var(--muted); font-family: var(--mono); }
  .rating-bar-track { height: 3px; background: var(--bg4); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .rating-bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
  .player-stats { display: flex; gap: 16px; font-size: 16px; color: var(--muted); flex-wrap: wrap; }
  .player-stats b { color: var(--text); }
  .lobby-indicator { margin-top: 8px; font-size: 12px; font-weight: 700; }

  /* ── Grid ── */
  .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

  /* ── Inputs / buttons ── */
  input, select, textarea {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; padding: 9px 12px;
    color: var(--text); font-family: var(--font); font-size: 14px;
    outline: none; transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--blue); }
  input[type=range] {
    background: none; border: none; padding: 4px 0;
    accent-color: var(--red); cursor: pointer;
  }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 18px; border-radius: 10px;
    font-family: var(--font); font-weight: 700; font-size: 13px; letter-spacing: 1px;
    cursor: pointer; transition: opacity .15s, transform .1s; border: none;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { background: var(--bg4); color: var(--muted); cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--blue); color: var(--text); }
  .btn-icon { padding: 6px 9px; background: var(--bg3); border: 1px solid var(--border); color: var(--muted); font-size: 14px; border-radius: 7px; }
  .btn-icon:hover { color: var(--text); border-color: var(--border2); }
  .btn-icon.danger:hover { color: #fc8181; border-color: #7a1f1f; }

  /* ── Section labels ── */
  .sec-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); margin-bottom: 12px; font-family: var(--mono); }

  /* ── Team columns ── */
  .teams-row { display: flex; gap: 14px; }
  .team-col { flex: 1; min-width: 0; border-radius: 14px; padding: 18px; border: 1px solid; }
  .team-col.ct { background: var(--bg2); border-color: rgba(66,153,225,.25); }
  .team-col.t  { background: var(--bg2); border-color: rgba(229,62,62,.25); }
  .team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .team-label { font-size: 18px; font-weight: 800; letter-spacing: 3px; }
  .team-avg { font-size: 12px; color: var(--muted); }
  .team-player-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; background: var(--bg3); border-radius: 8px; margin-bottom: 7px;
  }
  .tpr-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .tpr-role { font-size: 11px; color: var(--muted); }
  .tpr-rank { font-size: 12px; font-weight: 600; }

  /* ── Map buttons ── */
  .map-btn {
    padding: 10px 18px; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: 10px;
    color: var(--text); font-family: var(--font); font-weight: 700;
    font-size: 13px; letter-spacing: 2px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .map-btn:hover { background: var(--bg4); border-color: var(--blue); color: var(--blue); }

  /* ── Win buttons ── */
  .win-btn {
    flex: 1; padding: 18px; border-radius: 12px;
    font-family: var(--font); font-weight: 800; font-size: 20px; letter-spacing: 3px;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .win-btn:active { transform: scale(.97); }
  .win-btn.ct { background: var(--blue-dim); border: 2px solid var(--blue); color: var(--blue); }
  .win-btn.t  { background: var(--red-dim); border: 2px solid var(--red); color: var(--red); }
  .win-btn:hover { opacity: .85; }

  /* ── Lobby tag ── */
  .lobby-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: #0f1e10; border: 1px solid #2a5a2a;
    border-radius: 20px; padding: 5px 12px;
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .lobby-tag-dot { width: 8px; height: 8px; border-radius: 50%; }
  .lobby-tag-x {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 0 0 4px;
  }
  .lobby-tag-x:hover { color: #fc8181; }

  /* ── History card ── */
  .hist-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .hist-badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .hist-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .hist-player-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }

  /* ── Stat modal player ── */
  .stat-player { margin-bottom: 14px; padding: 12px 14px; background: var(--bg3); border-radius: 10px; border: 1px solid var(--border2); }
  .stat-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat-fields label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; text-transform: capitalize; }
  .stat-fields input { width: 100%; padding: 6px 8px; font-size: 13px; }

  /* ── Add form ── */
  #add-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #add-form input[type=text] { flex: 2; min-width: 140px; }
  #add-form select { flex: 1; min-width: 130px; }
  .add-rating-wrap { flex: 2; min-width: 180px; }
  .add-rating-wrap span { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
  #add-form input[type=range] { width: 100%; }

  /* ── Search ── */
  #search-row { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  #search-row input { flex: 1; }
  #search-count { color: var(--muted); font-size: 13px; white-space: nowrap; font-family: var(--mono); }

  /* ── Drag handle ── */
  .drag-handle { cursor: grab; color: var(--muted2); font-size: 16px; padding: 0 4px; }

  /* ── Empty state ── */
  .empty-state { text-align: center; color: var(--muted); padding-top: 60px; }
  .empty-state .empty-icon { font-size: 48px; display: block; margin-bottom: 16px; opacity: .5; }
  .empty-state p { font-size: 15px; margin-bottom: 6px; }
  .empty-state small { font-size: 13px; }

  /* ── Corner decoration ── */
  .corner-tl, .corner-br {
    position: absolute; width: 12px; height: 12px;
    pointer-events: none;
  }
  .corner-tl { top: 8px; left: 8px; border-top: 2px solid var(--border2); border-left: 2px solid var(--border2); }
  .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--border2); border-right: 2px solid var(--border2); }

  @media (max-width: 640px) {
    .teams-row { flex-direction: column; }
    #add-form { gap: 8px; }
    .hist-teams { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div class="logo">CS2</div>
    <div class="logo-sep">|</div>
    <div class="logo-title">PICKUP ORGANIZER</div>
    <div id="header-stats">0 players · 0 matches</div>
  <div id="readonly-badge" style="display:none;padding:3px 10px;background:#1a2533;border:1px solid #2a3a4a;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:1px;color:#64748b">👁 VIEW ONLY</div>
  <button id="admin-btn" onclick="promptAdmin()" style="padding:3px 10px;background:transparent;border:1px solid #1a2533;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:1px;color:#2a3a4a;cursor:pointer;font-family:var(--font)">🔒 Admin</button>
  </div>

  <div id="nav">
    <button class="nav-btn active" data-view="roster">ROSTER</button>
    <button class="nav-btn" data-view="lobby">LOBBY <span id="nav-lobby-count">(0/10)</span></button>
    <button class="nav-btn" data-view="match">MATCH</button>
    <button class="nav-btn" data-view="history">HISTORY</button>
    <button class="nav-btn" data-view="leaderboard">LEADERBOARD</button>
    <button class="nav-btn" data-view="rankings">RANK SUGGESTIONS</button>
  </div>

  <div id="content"></div>
</div>

<div id="flash"></div>

<script>
// ─── Data & state ──────────────────────────────────────────────────────────
const MAPS = ["Dust2","Mirage","Inferno","Nuke","Overpass","Ancient","Anubis","Vertigo","Cache"];
const ROLES = ["Entry Fragger","AWPer","Support","IGL","Lurker","Flex"];

// ─── Admin auth ───────────────────────────────────────────────────────────
const ADMIN_HASH = "6b459776b8d6c34a17ff055736199da50101a9a2612e39b3b368c03fe60a7978";
let READONLY = true; // default: readonly for everyone

async function hashString(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function checkAdminSession() {
  // Session-only: cleared when tab closes
  READONLY = sessionStorage.getItem("cs2_admin") !== "1";
}

async function promptAdmin() {
  const pw = prompt("Enter admin password:");
  if (!pw) return;
  const hash = await hashString(pw);
  if (hash === ADMIN_HASH) {
    sessionStorage.setItem("cs2_admin", "1");
    READONLY = false;
    render();
    updateAdminBadge();
    flash("Admin mode unlocked");
  } else {
    alert("Incorrect password.");
  }
}

function updateAdminBadge() {
  const badge = document.getElementById("readonly-badge");
  const adminBtn = document.getElementById("admin-btn");
  if (!badge || !adminBtn) return;
  if (READONLY) {
    badge.style.display = "block";
    badge.textContent = "👁 VIEW ONLY";
    adminBtn.textContent = "🔒 Admin";
    document.querySelectorAll(".nav-btn[data-view='match']").forEach(b => b.style.display = "none");
  } else {
    badge.style.display = "block";
    badge.textContent = "🔓 ADMIN";
    badge.style.color = "#68D391";
    adminBtn.textContent = "🔓 Admin";
    document.querySelectorAll(".nav-btn[data-view='match']").forEach(b => b.style.display = "");
  }
}
const RANK_LABELS = {
  1:"Silver 1",2:"Silver 2",3:"Silver 3",4:"Silver 4",5:"Silver Elite",6:"Silver Elite Master",
  7:"Gold Nova 1",8:"Gold Nova 2",9:"Gold Nova 3",10:"Gold Nova Master",
  11:"Master Guardian 1",12:"Master Guardian 2",13:"Master Guardian Elite",14:"Distinguished Master Guardian",
  15:"Legendary Eagle",16:"Legendary Eagle Master",17:"Supreme Master First Class",18:"Global Elite"
};
// Rank color gradient: grey -> light blue -> blue -> light purple -> purple -> pink -> red -> gold
const RANK_COLOR_STOPS = [
  [1,  "#C0C8D0"], // grey-white
  [3,  "#A8B8C8"], // light grey
  [5,  "#8AAEC8"], // grey-blue
  [7,  "#6EB4E8"], // light blue
  [9,  "#4299E1"], // blue
  [11, "#818CF8"], // light purple
  [13, "#A855F7"], // purple
  [15, "#D946A8"], // purple-pink
  [16, "#F43F5E"], // pink-red
  [17, "#E53E3E"], // red
  [18, "#F6C343"], // gold
];
function rankColor(r) {
  const v = Math.max(1, Math.min(18, r));
  for (let i = 0; i < RANK_COLOR_STOPS.length - 1; i++) {
    const [r0, c0] = RANK_COLOR_STOPS[i];
    const [r1, c1] = RANK_COLOR_STOPS[i + 1];
    if (v >= r0 && v <= r1) {
      const t = (v - r0) / (r1 - r0);
      const hex = h => parseInt(h, 16);
      const lerp = (a, b) => Math.round(a + (b - a) * t).toString(16).padStart(2, "0");
      const h0 = [c0.slice(1,3), c0.slice(3,5), c0.slice(5,7)];
      const h1 = [c1.slice(1,3), c1.slice(3,5), c1.slice(5,7)];
      return "#" + lerp(hex(h0[0]), hex(h1[0])) + lerp(hex(h0[1]), hex(h1[1])) + lerp(hex(h0[2]), hex(h1[2]));
    }
  }
  return RANK_COLOR_STOPS[RANK_COLOR_STOPS.length - 1][1];
}
const rankLabel = r => RANK_LABELS[Math.round(r)] || "Unranked";
const genId = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function calcElo(playerRating, oppAvg, won, kd) {
  const K = 32;
  const exp = 1 / (1 + Math.pow(10, (oppAvg - playerRating) / 400 * 18));
  const outcome = won ? 1 : 0;
  const perfBonus = (kd - 1) * 0.2;
  return K * (outcome - exp) + perfBonus * K * 0.3;
}

// Separate ELO calculation on a 1000-baseline scale
function calcEloPoints(playerElo, oppAvgElo, won, kd) {
  const K = 25;
  const exp = 1 / (1 + Math.pow(10, (oppAvgElo - playerElo) / 400));
  const outcome = won ? 1 : 0;
  const perfBonus = (kd - 1) * 0.15;
  return Math.round(K * (outcome - exp) + perfBonus * K * 0.4);
}

let state = {
  view: "roster",
  players: [],
  matches: [],
  lobby: [],         // array of player ids
  teams: null,       // { ct:[], t:[] }
  currentMatch: null,
  pendingStats: {},  // { ct: {id: {k,d,a}}, t: {...} }
  addForm: { name:"", rating:10, role:"Flex" },
  searchQ: "",
  editId: null,
  // captain draft
  draft: null,       // { captains:[ctId,tId], pool:[ids], picks:{ct:[],t:[]}, turn:"ct" }
};

const DEFAULT_PLAYERS = [
  {id:genId(),name:"ambient",rating:10,role:"Flex",matchHistory:[]},
  {id:genId(),name:"apt",rating:6,role:"Flex",matchHistory:[],aliases:["john gilkison","johng","johngilkison","karl dandleton","karldandleton","gunkleman"]},
  {id:genId(),name:"attkr",rating:13,role:"Flex",matchHistory:[],aliases:[]},
  {id:genId(),name:"Benton",rating:9,role:"Flex",matchHistory:[],aliases:["james_plays_games","jamesplaysgames","james plays games"]},
  {id:genId(),name:"Chris",rating:9,role:"Flex",matchHistory:[]},
  {id:genId(),name:"cows",rating:8,role:"Flex",matchHistory:[]},
  {id:genId(),name:"glyde",rating:16,role:"Flex",matchHistory:[],aliases:["kaylanelson","kayla nelson","76561199074380290"]},
  {id:genId(),name:"Glynth",rating:8,role:"Flex",matchHistory:[]},
  {id:genId(),name:"gwhatkey",rating:14,role:"Flex",matchHistory:[]},
  {id:genId(),name:"krypa",rating:9,role:"Flex",matchHistory:[]},
  {id:genId(),name:"liftie",rating:11,role:"Flex",matchHistory:[]},
  {id:genId(),name:"lnr",rating:8,role:"Flex",matchHistory:[]},
  {id:genId(),name:"mb",rating:12,role:"Flex",matchHistory:[]},
  {id:genId(),name:"gnarly",rating:7,role:"Flex",matchHistory:[],aliases:["freak!/oddity","freakodity","freak!","oddity","freakslashOddity"]},
  {id:genId(),name:"penguin",rating:14,role:"Flex",matchHistory:[],aliases:["tae bo blackbelt","taeboblackbelt","tae bo"]},
  {id:genId(),name:"stu",rating:9,role:"Flex",matchHistory:[],aliases:["bigxturdstealer","BIGxTURDSTEALER","big x turd stealer"]},
  {id:genId(),name:"tiny",rating:8,role:"Flex",matchHistory:[]},
  {id:genId(),name:"twigs",rating:9,role:"Flex",matchHistory:[]},
  {id:genId(),name:"yrb",rating:13,role:"Flex",matchHistory:[],aliases:["bbbbb","loom_weaver","loomweaver"]},
  {id:genId(),name:"ziGGeh",rating:15,role:"Flex",matchHistory:[],aliases:["mofries"]},
  {id:genId(),name:"adhd",rating:9,role:"Flex",matchHistory:[],aliases:["paul enhance","paulenhance"]},
  {id:genId(),name:"Bill Nogel",rating:9,role:"Flex",matchHistory:[],aliases:["bill nogel","billnogel","ophianoi"]},
];

// ─── Persistence ───────────────────────────────────────────────────────────
// ─── API config (proxied via Cloudflare Worker — key never exposed) ─────────
const JSONBIN_URL = "https://cs2-pickup-api.penguinfrags.workers.dev";
let   saveTimeout = null;

async function loadData() {
  // 1. Load from localStorage instantly so the app is usable immediately
  try {
    const p = localStorage.getItem("cs2_players");
    const m = localStorage.getItem("cs2_matches");
    state.players = p ? JSON.parse(p) : JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
    state.matches  = m ? JSON.parse(m) : [];
  } catch {
    state.players = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
    state.matches = [];
  }

  // 2. Show a small syncing badge in the header while fetching remote
  const showSync = (msg, color="var(--muted)") => {
    let el = document.getElementById("sync-badge");
    if (!el) {
      el = document.createElement("div");
      el.id = "sync-badge";
      el.style.cssText = "font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);transition:opacity .3s";
      document.getElementById("header-stats")?.after(el);
    }
    el.textContent = msg;
    el.style.color = color;
    el.style.opacity = "1";
  };

  const showSpinner = () => {
    if (document.getElementById("sync-spinner")) return;
    const el = document.createElement("div");
    el.id = "sync-spinner";
    el.style.cssText = "position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,8,15,0.6);z-index:8000;pointer-events:none";
    el.innerHTML = `
      <div style="width:44px;height:44px;border:3px solid var(--border2);border-top-color:#e53e3e;border-radius:50%;animation:spin .7s linear infinite"></div>
      <div style="font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted)">SYNCING…</div>`;
    if (!document.getElementById("spin-style")) {
      const style = document.createElement("style");
      style.id = "spin-style";
      style.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
      document.head.appendChild(style);
    }
    document.body.appendChild(el);
  };

  const hideSpinner = () => {
    const el = document.getElementById("sync-spinner");
    if (el) { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(()=>el.remove(), 350); }
  };

  const hideSync = () => {
    const el = document.getElementById("sync-badge");
    if (el) { el.style.opacity = "0"; setTimeout(()=>el.remove(), 400); }
  };

  showSync("⟳ SYNCING…");
  showSpinner();

  // 2. Fetch from JSONBin in the background
  const attemptFetch = async () => {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);
    try {
      const res = await fetch(JSONBIN_URL, {
        headers: {},
        signal: controller.signal
      });
      clearTimeout(timeout);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch(e) {
      clearTimeout(timeout);
      throw e;
    }
  };

  try {
    let json;
    try {
      json = await attemptFetch();
    } catch(e) {
      // one retry after 2s
      await new Promise(r => setTimeout(r, 2000));
      json = await attemptFetch();
    }
    const data = json.record || json;
    if (data.players && data.players.length) {
      state.players = data.players;
      state.matches = data.matches || [];
      localStorage.setItem("cs2_players", JSON.stringify(state.players));
      localStorage.setItem("cs2_matches", JSON.stringify(state.matches));
      render();
    }
    showSync("✓ SYNCED", "#68D391");
    hideSpinner();
    setTimeout(hideSync, 2000);
  } catch (err) {
    if (err.name === "AbortError") {
      hideSpinner();
      showSync("⚠ OFFLINE", "#ECC94B");
      setTimeout(hideSync, 3000);
    } else {
      console.error("JSONBin load error:", err);
      hideSpinner();
      showSync("⚠ CACHED", "#ECC94B");
      setTimeout(hideSync, 3000);
    }
  }
}

function saveData() {
  // Always cache locally as backup
  localStorage.setItem("cs2_players", JSON.stringify(state.players));
  localStorage.setItem("cs2_matches", JSON.stringify(state.matches));
  // Debounce remote saves — wait 800ms after last change before writing
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await fetch(JSONBIN_URL, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ players: state.players, matches: state.matches })
      });
    } catch (err) {
      console.error("JSONBin save error:", err);
      flash("Save failed — data cached locally");
    }
  }, 800);
}

// ─── Rank badge SVG ────────────────────────────────────────────────────────
function rankBadgeSVG(rating, color) {
  const display = (Math.round(rating * 2) / 2).toFixed(1);
  const fontSize = display.length >= 4 ? "9" : "11";
  return `<svg width="36" height="40" viewBox="0 0 32 36" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 2 L30 8 L30 20 C30 27 16 34 16 34 C16 34 2 27 2 20 L2 8 Z" fill="${color}22" stroke="${color}" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" font-family="'Share Tech Mono',monospace" font-size="${fontSize}" font-weight="700" fill="${color}">${display}</text>
  </svg>`;
}

// ─── Shared HTML helpers ───────────────────────────────────────────────────
function getLRMedals() {
  const ranked = state.players
    .map(p => {
      const h = p.matchHistory || [];
      const vals = h.map(m=>m.leetifyRating).filter(v=>v!=null);
      const avg = vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      return { id: p.id, avg };
    })
    .filter(x => x.avg !== null)
    .sort((a,b) => b.avg - a.avg);
  const m = {};
  if (ranked[0]) m[ranked[0].id] = "🥇";
  if (ranked[1]) m[ranked[1].id] = "🥈";
  if (ranked[2]) m[ranked[2].id] = "🥉";
  return m;
}

function playerCardHTML(p, selectable) {
  const inLobby = state.lobby.includes(p.id);
  const hist  = p.matchHistory || [];
  const wins  = hist.filter(m=>m.won).length;
  const total = hist.length;
  const kdArr = hist.map(m=>m.deaths>0?m.kills/m.deaths:m.kills);
  const avgKD = total > 0 ? (kdArr.reduce((a,b)=>a+b,0)/total).toFixed(2) : "—";
  const pct   = ((p.rating-1)/17*100).toFixed(1);
  const color = rankColor(p.rating);
  const label = rankLabel(p.rating);
  const badge = rankBadgeSVG(p.rating, color);

  // ELO (separate from manual skill rating)
  const elo        = p.elo ?? (total > 0 ? 1000 : null);
  const lastDelta  = total > 0 ? (hist[hist.length-1].eloDelta ?? null) : null;
  const deltaColor = lastDelta > 0 ? "#68D391" : lastDelta < 0 ? "#fc8181" : "#5a7080";
  const deltaStr   = lastDelta !== null ? `${lastDelta > 0 ? "+" : ""}${lastDelta}` : "";
  const netElo     = elo !== null ? elo - 1000 : 0;
  const netColor   = netElo > 0 ? "#68D391" : netElo < 0 ? "#fc8181" : "#5a7080";

  // Last 5 results
  const last5 = hist.slice(-5).map(m =>
    m.won
      ? `<span style="font-size:18px;font-weight:800;color:#68D391">W</span>`
      : `<span style="font-size:18px;font-weight:800;color:#fc8181">L</span>`
  ).join('<span style="color:var(--muted2);font-size:9px">·</span>');
  const lrValues  = hist.map(m=>m.leetifyRating).filter(v=>v!=null);
  const avgLRRaw  = lrValues.length > 0 ? lrValues.reduce((a,b)=>a+b,0)/lrValues.length : null;
  const avgLR     = avgLRRaw !== null ? avgLRRaw * 100 : null;
  const lrColor   = avgLR !== null ? (avgLR > 1 ? "#68D391" : avgLR < -5 ? "#fc8181" : "var(--muted)") : "var(--muted)";

  // ADR (avg damage per round from all matches with round data)
  const totalDamage = hist.reduce((s,m)=>s+(m.damage||0),0);
  const totalRounds = hist.reduce((s,m)=>{
    const mr = state.matches.find(x=>x.id===m.matchId);
    return s + (mr?.roundScore ? (mr.roundScore.ct + mr.roundScore.t) : 0);
  }, 0);
  const adr = totalRounds > 0 ? totalDamage / totalRounds : null;

  return `
  <div class="card${selectable?' clickable':''}${inLobby?' in-lobby':''}"
       ${selectable?`data-toggle-lobby="${esc(p.id)}"`:''}>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <div style="flex-shrink:0;opacity:0.92">${badge}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:baseline;gap:7px">
          <div class="player-name">${esc(p.name)}</div>
          ${getLRMedals()[p.id] ? `<span style="font-size:18px;line-height:1">${getLRMedals()[p.id]}</span>` : ''}
          ${lastDelta !== null ? `<span style="font-size:15px;font-weight:700;color:${deltaColor};font-family:var(--mono)">${deltaStr}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:1px">
          <div style="font-size:16px;color:${color};font-weight:700;letter-spacing:.5px">${esc(label)}</div>
          ${elo !== null ? `<div style="font-size:15px;font-weight:700;color:var(--muted);font-family:var(--mono)">ELO <span style="color:${netColor}">${elo}</span></div>` : ''}
        </div>
        <div class="player-role" style="margin-top:4px">${esc(p.role)}</div>
      </div>
      ${selectable ? `<div style="font-size:15px;font-weight:700;letter-spacing:1px;color:${inLobby?'#68D391':'#4299E1'};text-align:right;flex-shrink:0">${inLobby?'✓ IN<br>LOBBY':'+ ADD<br>LOBBY'}</div>` : ''}
    </div>
    <div class="rating-bar-track" style="margin-bottom:10px">
      <div class="rating-bar-fill" style="width:${pct}%;background:${color}"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="player-stats" style="font-size:17px">
        <span>W/L: <b>${wins}/${total-wins}</b></span>
        <span>K/D: <b>${avgKD}</b></span>
        ${avgLR !== null ? `<span>LR: <b style="color:${lrColor}">${avgLR>=0?"+":""}${avgLR.toFixed(2)}</b></span>` : ''}
        ${adr !== null ? `<span>ADR: <b>${adr.toFixed(1)}</b></span>` : ''}
        ${avgLR === null && adr === null ? `<span>Matches: <b>${total}</b></span>` : ''}
      </div>
      ${!READONLY ? `<div style="display:flex;gap:5px;flex-shrink:0">
        <button class="btn-icon" data-edit="${esc(p.id)}" title="Edit">✎</button>
        <button class="btn-icon danger" data-remove="${esc(p.id)}" title="Remove">✕</button>
      </div>` : ''}
    </div>
    ${total > 0 ? `<div style="display:flex;align-items:center;gap:6px;margin-top:12px">${last5.replace(/font-size:18px/g,'font-size:22px')}</div>` : ''}
  </div>`;
}

// ─── Rank adjustment suggestions ─────────────────────────────────────────
function getRankSuggestions() {
  // ELO drift thresholds — how far ELO needs to move before suggesting a rank change
  const THRESHOLD = 35; // ELO points from 1000 baseline
  const ELO_TO_RANK_SCALE = 17 / 400; // maps ±400 ELO to ±17 rank levels

  return state.players
    .filter(p => (p.matchHistory||[]).length >= 3 && p.elo != null)
    .map(p => {
      const drift = (p.elo - 1000); // positive = overperforming, negative = underperforming
      if (Math.abs(drift) < THRESHOLD) return null;
      // Suggested rank change proportional to ELO drift
      const change = drift * ELO_TO_RANK_SCALE;
      const suggested = Math.max(1, Math.min(18, p.rating + change));
      const rounded = Math.round(suggested * 2) / 2; // snap to 0.5 increments
      if (Math.abs(rounded - p.rating) < 0.5) return null; // not enough change to bother
      return {
        id: p.id,
        name: p.name,
        current: p.rating,
        suggested: rounded,
        drift,
        up: rounded > p.rating,
      };
    })
    .filter(Boolean)
    .sort((a,b) => Math.abs(b.drift) - Math.abs(a.drift));
}

        ${ROLES.map(r=>`<option${r===state.addForm.role?' selected':''}>${esc(r)}</option>`).join('')}
      </select>

        <input type="range" id="new-rating" min="1" max="18" step="1" value="${state.addForm.rating}" />
      </div>

function bindRoster() {
  document.getElementById("search-input").addEventListener("input", e => {
    state.searchQ = e.target.value; render();
  });
  document.getElementById("new-name")?.addEventListener("input", e => { state.addForm.name = e.target.value; });
  document.getElementById("new-role")?.addEventListener("change", e => { state.addForm.role = e.target.value; });
  document.getElementById("new-rating")?.addEventListener("input", e => {
    state.addForm.rating = +e.target.value;
    document.getElementById("rating-lbl").textContent = `Skill: ${rankLabel(state.addForm.rating)} (${state.addForm.rating})`;
  });
  document.getElementById("add-btn")?.addEventListener("click", addPlayer);
  document.getElementById("new-name")?.addEventListener("keydown", e => { if(e.key==="Enter") addPlayer(); });

  document.getElementById("players-grid").addEventListener("click", e => {
    const editId   = e.target.closest("[data-edit]")?.dataset.edit;
    const removeId = e.target.closest("[data-remove]")?.dataset.remove;
    if (editId)   { openEdit(editId); return; }
    if (removeId) { removePlayer(removeId); return; }
    const toggleId = e.target.closest("[data-toggle-lobby]")?.dataset.toggleLobby;
    if (toggleId) toggleLobby(toggleId);
  });

  // Apply rank suggestion
  document.querySelectorAll("[data-apply-suggestion]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const pid = btn.dataset.applySuggestion;
      const newRating = parseFloat(btn.dataset.suggestedRating);
      const idx = state.players.findIndex(p=>p.id===pid);
      if (idx > -1) {
        const old = state.players[idx].rating;
        state.players[idx].rating = newRating;
        // Reset ELO back to 1000 baseline after applying the rank correction
        state.players[idx].elo = 1000;
        saveData(); render();
        flash(`${state.players[idx]?.name || "Player"} rating updated ${old.toFixed(1)} → ${newRating.toFixed(1)} · ELO reset to 1000`);
      }
    });
  });
}

function checkAddRateLimit() {
  if (READONLY === false) return true; // admins unlimited
  const LIMIT = 5;
  const WINDOW = 60 * 60 * 1000; // 1 hour
  const now = Date.now();
  const raw = localStorage.getItem("cs2_add_log");
  const log = raw ? JSON.parse(raw).filter(t => now - t < WINDOW) : [];
  if (log.length >= LIMIT) {
    const oldest = log[0];
    const minsLeft = Math.ceil((WINDOW - (now - oldest)) / 60000);
    flash(`Player limit reached — try again in ${minsLeft} min`);
    return false;
  }
  log.push(now);
  localStorage.setItem("cs2_add_log", JSON.stringify(log));
  return true;
}

function addPlayer() {
  const name = document.getElementById("new-name").value.trim();
  if (!name) { flash("Enter a player name"); return; }
  if (!checkAddRateLimit()) return;
  const p = { id:genId(), name, rating:state.addForm.rating, role:state.addForm.role, matchHistory:[] };
  state.players.push(p);
  state.addForm.name = "";
  saveData(); render();
  flash(`${p.name} added to roster`);
}

function removePlayer(id) {
  const p = state.players.find(x=>x.id===id);
  state.players = state.players.filter(x=>x.id!==id);
  state.lobby = state.lobby.filter(i=>i!==id);
  saveData(); render();
  if(p) flash(`${p.name} removed`);
}

// ─── Edit modal ────────────────────────────────────────────────────────────
function openEdit(id) {
  const p = state.players.find(x=>x.id===id);

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "edit-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3 style="color:var(--text);margin-bottom:20px;font-size:16px;">EDIT PLAYER</h3>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Name</label>
      <input id="edit-name" type="text" value="${esc(p.name)}" style="width:100%;margin-bottom:14px" />
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Role</label>
      <select id="edit-role" style="width:100%;margin-bottom:14px">
        ${ROLES.map(r=>`<option${r===p.role?' selected':''}>${esc(r)}</option>`).join('')}
      </select>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Aliases (Steam names, comma-separated)</label>
      <input id="edit-aliases" type="text" value="${esc((p.aliases||[]).join(", "))}" placeholder="e.g. john gilkison, johng" style="width:100%;margin-bottom:14px" />
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px" id="edit-rating-lbl">Rating: ${rankLabel(Math.round(p.rating))} (${p.rating.toFixed(1)})</label>
      <input id="edit-rating" type="range" min="1" max="18" step="0.5" value="${p.rating}" style="width:100%;margin-bottom:20px" />
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="edit-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2" id="edit-save">Save Changes</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById("edit-rating").addEventListener("input", e => {
    document.getElementById("edit-rating-lbl").textContent = `Rating: ${rankLabel(Math.round(+e.target.value))} (${(+e.target.value).toFixed(1)})`;
  });
  document.getElementById("edit-cancel").addEventListener("click", () => overlay.remove());
  document.getElementById("edit-save").addEventListener("click", () => {
    const newName    = document.getElementById("edit-name").value.trim();
    const newRole    = document.getElementById("edit-role").value;
    const newRating  = +document.getElementById("edit-rating").value;
    const aliasRaw   = document.getElementById("edit-aliases").value;
    const newAliases = aliasRaw.split(",").map(a=>a.trim()).filter(Boolean);
    if(!newName) { flash("Name can't be empty"); return; }
    const idx = state.players.findIndex(x=>x.id===id);
    if(idx>-1) { state.players[idx] = {...state.players[idx], name:newName, role:newRole, rating:newRating, aliases:newAliases}; }
    saveData(); overlay.remove(); render();
    flash(`${newName} updated`);
  });
  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });
}

// ─── LOBBY ────────────────────────────────────────────────────────────────
function toggleLobby(id) {
  if (state.lobby.includes(id)) {
    state.lobby = state.lobby.filter(i=>i!==id);
  } else {
    if (state.lobby.length >= 10) { flash("Lobby full — max 10 players"); return; }
    state.lobby.push(id);
  }
  render();
}

      <div style="color:var(--muted);font-size:13px">Select exactly 10 players, then choose how to build teams</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" id="draft-btn" ${canBalance?'':'disabled'} style="${canBalance?'border-color:var(--blue);color:var(--blue)':''}">
        ⚑ CAPTAIN'S DRAFT
      </button>
      <button class="btn btn-primary" id="balance-btn" ${canBalance?'':'disabled'}>
        ${canBalance ? '⚖ AUTO BALANCE' : `${state.lobby.length}/10 SELECTED`}
      </button>
    </div>
  </div>

  ${lobbyPlayers.length>0?`
  <div class="card" style="margin-bottom:20px">
    <div class="sec-label">CURRENT LOBBY — ${state.lobby.length}/10</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${tags}</div>
  </div>`:''}

  <div class="players-grid" id="lobby-grid">
    ${[...state.players].sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase())).map(p=>playerCardHTML(p,true)).join('')}
  </div>`;
}

function bindLobby() {
  document.getElementById("balance-btn")?.addEventListener("click", balanceTeams);
  document.getElementById("draft-btn")?.addEventListener("click", startDraft);
  document.getElementById("lobby-grid")?.addEventListener("click", e => {
    const editId   = e.target.closest("[data-edit]")?.dataset.edit;
    const removeId = e.target.closest("[data-remove]")?.dataset.remove;
    if (editId)   { openEdit(editId); return; }
    if (removeId) { removePlayer(removeId); return; }
    const toggleId = e.target.closest("[data-toggle-lobby]")?.dataset.toggleLobby;
    if (toggleId) toggleLobby(toggleId);
  });
  document.querySelectorAll(".lobby-tag-x").forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); toggleLobby(btn.dataset.toggleLobby); });
  });
}

function balanceTeams() {
  if (state.lobby.length !== 10) return;
  const pool = state.lobby.map(id=>state.players.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>b.rating-a.rating);
  const ct=[], t=[];
  pool.forEach((p,i) => {
    const block = Math.floor(i/2);
    const pos   = i%2;
    if(block%2===0) { pos===0?ct.push(p):t.push(p); }
    else            { pos===0?t.push(p):ct.push(p); }
  });
  state.teams = { ct, t };
  state.currentMatch = null;
  state.pendingStats = {};
  setView("match");
  flash("Teams balanced — select a map to start");
}

// ─── CAPTAIN'S DRAFT ─────────────────────────────────────────────────────
function startDraft() {
  if (state.lobby.length !== 10) return;
  const allIds = state.lobby.slice();
  state.draft = {
    phase: "captains",  // "captains" | "picks"
    captains: { ct: null, t: null },
    pool: allIds,       // all 10 start in pool; captains are removed when selected
    picks: { ct: [], t: [] },
    turn: "ct",         // overwritten by coin flip when both captains are set
    firstPick: null,    // announced after coin flip
  };
  state.teams = null;
  state.currentMatch = null;
  state.pendingStats = {};
  setView("match");
}

function renderDraft() {
  const d = state.draft;

  // ── Phase 1: select captains ──────────────────────────────────────────
  if (d.phase === "captains") {
    const needCT = !d.captains.ct;
    const needT  = !d.captains.t;

          <div style="font-size:15px;font-weight:700;color:${cap?'var(--text)':'var(--muted)'}">${cap ? esc(cap.name) : 'Not selected'}</div>
          ${cap ? `<div style="font-size:11px;color:${rankColor(cap.rating)}">${esc(rankLabel(cap.rating))}</div>` : ''}
        </div>
      </div>`;
    };

    const poolCards = d.pool.map(id => {
      const p = state.players.find(x=>x.id===id);
      if (!p) return '';
      return `<div class="card clickable" data-set-captain="${esc(p.id)}" style="padding:12px 14px;display:flex;align-items:center;gap:10px;transition:border-color .15s;"

      <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">CAPTAIN'S DRAFT</div>
      <div style="display:flex;align-items:center;gap:8px">

        <span style="color:${selectingColor};font-weight:700;font-size:14px">Select ${selectingLabel} Captain</span>

      <div class="sec-label" style="margin-bottom:12px">SELECT ${selectingLabel} CAPTAIN FROM LOBBY</div>

  // ── Phase 2: picking ──────────────────────────────────────────────────
  const capCT = state.players.find(p=>p.id===d.captains.ct);

  const ctPicks = d.picks.ct.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
  const tPicks  = d.picks.t.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
  const pool    = d.pool.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
  const turnColor = d.turn==="ct" ? "var(--blue)" : "var(--red)";
  const turnCap   = d.turn==="ct" ? capCT : capT;
  const picksLeft = 10 - ctPicks.length - tPicks.length;

  const pickRow = (p, side) => {
    const isCap = p.id===d.captains.ct || p.id===d.captains.t;

    </div>

      <div style="color:var(--red);font-weight:800;font-size:16px;letter-spacing:3px;margin-bottom:12px">

function bindDraft() {
  // Phase 1: set captains
  document.querySelectorAll("[data-set-captain]").forEach(el => {
    el.addEventListener("click", () => {
      const pid = el.dataset.setCaptain;
      const d = state.draft;
      if (!d.captains.ct) {
        d.captains.ct = pid;
        d.picks.ct = [pid];
        d.pool = d.pool.filter(id=>id!==pid);
        // if T captain already chosen, randomize first pick and go to picks
        if (d.captains.t) {
          d.turn = Math.random() < 0.5 ? "ct" : "t";
          d.firstPick = d.turn;
          d.phase = "picks";
        }
      } else if (!d.captains.t) {
        d.captains.t = pid;
        d.picks.t = [pid];
        d.pool = d.pool.filter(id=>id!==pid);
        d.turn = Math.random() < 0.5 ? "ct" : "t";
        d.firstPick = d.turn;
        d.phase = "picks";
      }
      render();
    });
  });

  // Phase 2: picks
  document.querySelectorAll("[data-draft-pick]").forEach(el => {
    el.addEventListener("click", () => {
      const pid = el.dataset.draftPick;
      const d = state.draft;
      d.picks[d.turn].push(pid);
      d.pool = d.pool.filter(id=>id!==pid);
      if (d.pool.length === 0) {
        const getPlayers = ids => ids.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
        state.teams = { ct: getPlayers(d.picks.ct), t: getPlayers(d.picks.t) };
        state.draft = null;
        render();
        flash("Draft complete — select a map to start");
      } else {
        d.turn = d.turn==="ct" ? "t" : "ct";
        render();
      }
    });
  });
}

// ─── MATCH ────────────────────────────────────────────────────────────────
// Returns "PlayerName's team" using highest-rated player, or fallback
function teamLabel(players, fallback) {
  if (!players || !players.length) return fallback;
  const top = [...players].sort((a,b)=>b.rating-a.rating)[0];
  return top ? `${top.name}'s team` : fallback;
}

function teamColHTML(team, label, side, showStatBtn, statsEntered) {
  const avg = (team.reduce((s,p)=>s+p.rating,0)/team.length).toFixed(1);
  const color = side==="ct" ? "var(--blue)" : "var(--red)";
  const rows  = team.map(p=>`
    <div class="team-player-row">
      <div>
        <div class="tpr-name">${esc(p.name)}</div>
        <div class="tpr-role">${esc(p.role)}</div>
      </div>
      <div class="tpr-rank" style="color:${rankColor(p.rating)}">${esc(rankLabel(Math.round(p.rating)))}</div>
    </div>`).join('');

  const statBtn = showStatBtn ? `
    <button class="btn" style="width:100%;margin-top:12px;
      background:${statsEntered?'#1e4020':'var(--bg3)'};
      border:1px solid ${statsEntered?'#2a5a2a':color+'55'};
      color:${statsEntered?'#68D391':color};"
      data-stat-modal="${side}">
      ${statsEntered ? '✓ Stats Entered' : 'Enter Player Stats'}
    </button>` : '';

  return `
  <div class="team-col ${side}">
    <div class="team-header">
      <span class="team-label" style="color:${color}">${label}</span>
      <span class="team-avg">avg ${avg} · ${esc(rankLabel(Math.round(parseFloat(avg))))}</span>
    </div>
    ${rows}
    ${statBtn}
  </div>`;
}

function bindMatch() {
  if (state.draft) { bindDraft(); return; }
  document.querySelectorAll("[data-start-map]").forEach(btn => {
    btn.addEventListener("click", () => {
      const map = btn.dataset.startMap;

      state.pendingStats = {};
      render();
    });
  });
  document.querySelectorAll("[data-stat-modal]").forEach(btn => {
    btn.addEventListener("click", () => openStatModal(btn.dataset.statModal));
  });
  document.querySelectorAll("[data-winner]").forEach(btn => {
    btn.addEventListener("click", () => finalizeMatch(btn.dataset.winner));
  });
  document.getElementById("leetify-import-btn")?.addEventListener("click", openLeetifyImport);
}

// ─── Leetify import ──────────────────────────────────────────────────────
function openLeetifyImport() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "leetify-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(520px,95vw)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <h3 style="color:var(--text);font-size:16px;">Import from Leetify</h3>
      </div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6">
        Paste the Leetify match URL below. Stats will be fetched and matched to your roster players by name — you can adjust any mappings before confirming.
      </p>
      <input id="leetify-url" type="text" placeholder="https://leetify.com/app/match-details/xxxxxxxx-.../overview"
        style="width:100%;margin-bottom:12px" />
      <div id="leetify-status" style="font-size:12px;color:var(--muted);min-height:18px;margin-bottom:10px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="leetify-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2;background:#f84982;border:none" id="leetify-fetch">FETCH STATS</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const setStatus = (msg, color="#5a7080") => {
    const el = document.getElementById("leetify-status");
    if (el) { el.textContent = msg; el.style.color = color; }
  };

  document.getElementById("leetify-cancel").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });

  document.getElementById("leetify-fetch").addEventListener("click", async () => {
    const url = document.getElementById("leetify-url").value.trim();
    // extract UUID from URL
    const match = url.match(/match-details\/([0-9a-f-]{36})/i);
    if (!match) { setStatus("Could not find a match ID in that URL. Paste the full Leetify match URL.", "#e53e3e"); return; }
    const gameId = match[1];
    setStatus("Fetching match data from Leetify…");
    document.getElementById("leetify-fetch").disabled = true;

    try {
      const res = await fetch(`https://api.cs-prod.leetify.com/api/games/${gameId}`);
      if (!res.ok) throw new Error(`API returned ${res.status}`);
      const data = await res.json();
      overlay.remove();
      openLeetifyMapping(data);
    } catch(err) {
      setStatus(`Failed to fetch: ${err.message}. Make sure the match is public on Leetify.`, "#e53e3e");
      document.getElementById("leetify-fetch").disabled = false;
    }
  });
}

function openLeetifyMapping(data) {
  // Flatten all player stats from the Leetify response
  // The public API returns data.playerStats[] or data.stats[] depending on version
  // Log the raw response so field names can be inspected if mapping breaks
  console.log("[Leetify import] raw response:", JSON.stringify(data).slice(0, 2000));
  const rawStats = data.playerStats || data.stats || data.players || [];
  if (!rawStats.length) {
    flash("No player stats found in Leetify response — check console for raw data");
    console.log("[Leetify import] full response:", data);
    return;
  }

  const allRosterPlayers = [
    ...(state.currentMatch.ct || []),
    ...(state.currentMatch.t  || [])
  ];

  // Build simple name similarity scorer
  const similarity = (a, b) => {
    a = a.toLowerCase().replace(/[^a-z0-9]/g, "");
    b = b.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (a === b) return 1;
    if (a.includes(b) || b.includes(a)) return 0.8;
    let matches = 0;
    for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) matches++;
    return matches / Math.max(a.length, b.length);
  };

  // Auto-suggest best match for each Leetify player
  const leetifyPlayers = rawStats.map(s => {
    const name    = s.name || s.player_name || s.steam_name || s.steamName || s.nickname || "Unknown";
    const kills   = s.totalKills   ?? s.total_kills   ?? s.kills   ?? 0;

    const assists = s.totalAssists ?? s.total_assists ?? s.assists ?? 0;
    const damage  = s.totalDamage  ?? s.total_damage  ?? s.damage  ?? 0;
    const leetifyRating = s.leetifyRating ?? s.leetify_rating ?? null;
    // initialTeamNumber: 3 = CT, 2 = T (Valve/CS2 convention)
    const teamNum = s.initialTeamNumber ?? s.teamNumber ?? s.team_number ?? null;
    const side    = teamNum === 2 ? "ct" : teamNum === 3 ? "t" : null;
    console.log("[Leetify import] player:", name, "K/D/A:", kills, deaths, assists, "dmg:", damage, "team:", teamNum, "->", side);
    // find best roster match — check player name AND all aliases
    let bestId = "", bestScore = -1;
    allRosterPlayers.forEach(p => {
      const namesToCheck = [p.name, ...(p.aliases || [])];
      const score = Math.max(...namesToCheck.map(n => similarity(name, n)));
      if (score > bestScore) { bestScore = score; bestId = p.id; }
    });
    return { name, kills, deaths, assists, damage, leetifyRating, side, suggestedId: bestId };
  });

  const overlay = document.createElement("div");

          </div>
          <div style="color:var(--muted);font-size:16px">→</div>
          <select data-lp-index="${i}" style="width:100%;font-size:13px">
            <option value="">— skip —</option>
            ${allRosterPlayers.map(p => `<option value="${esc(p.id)}" ${p.id===lp.suggestedId?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-ghost" id="lmap-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2;background:#f84982;border:none" id="lmap-confirm">APPLY STATS</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });
  document.getElementById("lmap-cancel").addEventListener("click", () => overlay.remove());

  document.getElementById("lmap-confirm").addEventListener("click", () => {
    const selects = overlay.querySelectorAll("select[data-lp-index]");
    const statsBySide = { ct: {}, t: {} };

    selects.forEach(sel => {
      const idx = parseInt(sel.dataset.lpIndex);
      const pid = sel.value;
      if (!pid) return;
      const lp = leetifyPlayers[idx];
      // prefer Leetify's own team assignment; fall back to checking current match teams
      const inCT = state.currentMatch.ct.some(p=>p.id===pid);
      const side = lp.side || (inCT ? "ct" : "t");
      statsBySide[side][pid] = { kills: lp.kills, deaths: lp.deaths, assists: lp.assists, damage: lp.damage||0, leetifyRating: lp.leetifyRating??null };
    });

    // Ensure every player on each team has an entry — fill gaps with zeros
    // so pendingStats is always complete for both sides
    ["ct","t"].forEach(side => {
      const team = state.currentMatch[side];
      if (!state.pendingStats[side]) state.pendingStats[side] = {};
      team.forEach(p => {
        if (statsBySide[side][p.id]) {
          // imported stat — always overwrite
          state.pendingStats[side][p.id] = statsBySide[side][p.id];
        } else if (!state.pendingStats[side][p.id]) {
          // no existing manual stat either — fill with zeros as placeholder
          state.pendingStats[side][p.id] = { kills: 0, deaths: 0, assists: 0 };
        }
        // else: player already has a manually entered stat — leave it alone
      });
    });

    overlay.remove();
    render();
    const mapped = Object.values(statsBySide.ct).length + Object.values(statsBySide.t).length;
    flash(`Leetify stats applied for ${mapped} players — open each team to review`);
  });
}

// ─── Finalize match ────────────────────────────────────────────────────────
function finalizeMatch(winner) {
  if (!state.pendingStats.ct || !state.pendingStats.t) { flash("Enter stats for both teams first"); return; }
  const match = state.currentMatch;
  const allPlayers = [...match.ct, ...match.t];

  allPlayers.forEach(p => {
    const isCT   = match.ct.some(x=>x.id===p.id);
    const side   = isCT?"ct":"t";
    const won    = winner===side;
    const s      = state.pendingStats[side][p.id] || {kills:0,deaths:0,assists:0};
    const kd     = s.deaths>0 ? s.kills/s.deaths : s.kills;
    const opp    = isCT ? match.t : match.ct;
    const curElo = p.elo ?? 1000;
    const oppAvgElo = opp.reduce((a,x)=>a+(x.elo??1000),0)/opp.length;
    const eloDelta  = calcEloPoints(curElo, oppAvgElo, won, kd);
    const newElo    = Math.max(0, curElo + eloDelta);

    const idx = state.players.findIndex(x=>x.id===p.id);
    if(idx>-1) {
      state.players[idx].elo = newElo;
      // rating stays untouched
      state.players[idx].matchHistory = [
        ...(state.players[idx].matchHistory||[]),
        { matchId:match.id, won, kills:s.kills, deaths:s.deaths, assists:s.assists, damage:s.damage||0, leetifyRating:s.leetifyRating??null, eloDelta }
      ];
    }
  });

  const record = {
    id:match.id, map:match.map, winner, playedAt:Date.now(),
    teams:{ ct:match.ct.map(p=>p.id), t:match.t.map(p=>p.id) },
    scores:state.pendingStats
  };
  state.matches.unshift(record);
  state.teams = null; state.currentMatch = null; state.pendingStats = {}; state.lobby = [];
  saveData();
  const winningTeam = winner==="ct" ? match.ct : match.t;
  flash(`${teamLabel(winningTeam,"Team 1")} wins on ${match.map}`);
  setView("history");
}

  return `
