  });
  document.getElementById("bulk-import-btn")?.addEventListener("click", openBulkImport);
}

// ─── Bulk Leetify import ──────────────────────────────────────────────────
function openBulkImport() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "bulk-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(780px,95vw)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <h3 style="color:var(--text);font-size:16px">Import Past Matches from Leetify</h3>
      </div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6">
        Paste one Leetify match URL per line. Each match will be fetched, players auto-matched to your roster by name and aliases, and you can confirm or adjust each before saving.
      </p>
      <textarea id="bulk-urls" rows="8" placeholder="https://leetify.com/app/match-details/xxxxxxxx-.../overview&#10;https://leetify.com/app/match-details/yyyyyyyy-.../overview"
        style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px;color:var(--text);font-family:var(--mono);font-size:13px;resize:vertical;margin-bottom:12px"></textarea>
      <div id="bulk-status" style="font-size:12px;color:var(--muted);min-height:18px;margin-bottom:12px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="bulk-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2;background:#f84982;border:none" id="bulk-fetch">FETCH MATCHES</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const setStatus = (msg, color="var(--muted)") => {
    const el = document.getElementById("bulk-status");
    if (el) { el.textContent = msg; el.style.color = color; }
  };

  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });
  document.getElementById("bulk-cancel").addEventListener("click", () => overlay.remove());

  document.getElementById("bulk-fetch").addEventListener("click", async () => {
    const raw = document.getElementById("bulk-urls").value.trim();
    const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
    const gameIds = [];
    for (const line of lines) {
      const m = line.match(/match-details\/([0-9a-f-]{36})/i);
      if (m) gameIds.push(m[1]);
    }
    if (!gameIds.length) { setStatus("No valid Leetify match URLs found.", "#e53e3e"); return; }

    document.getElementById("bulk-fetch").disabled = true;
    setStatus(`Fetching ${gameIds.length} match${gameIds.length>1?"es":""}…`);

    const results = [];
    for (let i = 0; i < gameIds.length; i++) {
      setStatus(`Fetching match ${i+1} of ${gameIds.length}…`);
      try {
        const res = await fetch(`https://api.cs-prod.leetify.com/api/games/${gameIds[i]}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        results.push({ gameId: gameIds[i], data, error: null });
      } catch(err) {
        results.push({ gameId: gameIds[i], data: null, error: err.message });
      }
    }

    const ok  = results.filter(r=>r.data);
    const bad = results.filter(r=>r.error);
    overlay.remove();

    if (!ok.length) {
      flash(`All ${bad.length} fetches failed — check match URLs and privacy settings`);
      return;
    }
    if (bad.length) flash(`${bad.length} match(es) failed to fetch — skipped`);

    try {
      openBulkMapping(ok.map(r=>r.data));
    } catch(err) {
      console.error("openBulkMapping error:", err);
      flash(`Import UI error: ${err.message} — check console`);
    }
  });
}

function openBulkMapping(matchDataList) {
  try {
  // similarity scorer (same as single import)
  const similarity = (a, b) => {
    a = a.toLowerCase().replace(/[^a-z0-9]/g, "");
    b = b.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!a || !b) return 0;
    if (a === b) return 1;
    if (a.includes(b) || b.includes(a)) return 0.8;
    let matches = 0;
    for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) matches++;
    return matches / Math.max(a.length, b.length);
  };

  const findBestPlayer = (steamName, steam64 = null) => {
    // Steam64 ID match first — exact and immune to name changes
    if (steam64) {
      const exact = state.players.find(p => p.steam64Id === steam64 || (p.aliases||[]).includes(steam64));
      if (exact) return exact.id;
    }
    let bestId = "", bestScore = -1;
    state.players.forEach(p => {
      const candidates = [p.name, ...(p.aliases||[])];
      const score = Math.max(...candidates.map(n => similarity(steamName, n)));
      if (score > bestScore) { bestScore = score; bestId = p.id; }
    });
    return bestScore > 0.3 ? bestId : "";
  };

  // Build a list of matches with their extracted player stats
  const parsedMatches = matchDataList.map(data => {
    console.log("[Leetify bulk] raw top-level keys:", Object.keys(data));
    const rawStats = data.playerStats || data.stats || data.players || [];
    if (rawStats.length) console.log("[Leetify bulk] first player raw:", JSON.stringify(rawStats[0]).slice(0,400));
    const map = data.mapName || data.map_name || data.map || "Unknown";
    const playedAt = data.finishedAt || data.finished_at || data.createdAt || Date.now();
    // figure out winner from team_scores
    // Winner: group players by initialTeamNumber, sum their total rounds won.
    // Each player reports the same value for their team so one per team is enough.
    // Team with more total rounds (ctRoundsWon + tRoundsWon) wins.
    let winner = "ct"; // "ct" = team2 won, "t" = team3 won (internal labels only)
    const ps2 = data.playerStats || data.stats || [];
    if (ps2.length) {
      const team2p = ps2.find(s => (s.initialTeamNumber ?? s.teamNumber) === 2);
      const team3p = ps2.find(s => (s.initialTeamNumber ?? s.teamNumber) === 3);
      if (team2p && team3p) {
        const team2wins = (team2p.ctRoundsWon||0) + (team2p.tRoundsWon||0);
        const team3wins = (team3p.ctRoundsWon||0) + (team3p.tRoundsWon||0);
        winner = team2wins > team3wins ? "ct" : "t";
        console.log("[Leetify] team2 totalWins:", team2wins, "team3 totalWins:", team3wins, "-> winner:", winner==="ct"?"team2":"team3");
      }
    }
    const players = rawStats.map(s => {
      const name    = s.name || s.player_name || s.steam_name || s.steamName || s.nickname || "Unknown";
      const kills   = s.totalKills   ?? s.total_kills   ?? s.kills   ?? 0;
      const deaths  = s.totalDeaths  ?? s.total_deaths  ?? s.deaths  ?? 0;
      const assists = s.totalAssists ?? s.total_assists ?? s.assists ?? 0;
      const damage  = s.totalDamage  ?? s.total_damage  ?? s.damage  ?? 0;
      const leetifyRating = s.leetifyRating ?? s.leetify_rating ?? null;
      const hltvRating    = s.hltvRating    ?? s.hltv_rating    ?? null;
      const reactionTime    = s.reactionTime    ?? null;
      const kast            = s.kast            ?? null;
      const counterRatio    = s.counterStrafingShotsGoodRatio ?? null;
      const counterAll      = s.counterStrafingShotsAll ?? 0;
      const wastedAmmo      = s.totalWastedMagazineAmmo ?? 0;
      const reloads         = s.totalReloads    ?? 0;
      const flashFriend     = s.flashbangHitFriend ?? 0;
      const flashFoe        = s.flashbangHitFoe ?? 0;
      const roundsSurvived  = s.roundsSurvived  ?? 0;
      const multi3k         = s.multi3k         ?? 0;
      const multi2k         = s.multi2k         ?? 0;
      const multi4k         = s.multi4k         ?? 0;
      const multi5k         = s.multi5k         ?? 0;
      const tradeKillsSucceeded = s.tradeKillsSucceeded ?? 0;
      const accuracy        = s.accuracy        ?? null;
      const dpr             = s.dpr             ?? null;
      const mvps            = s.mvps            ?? 0;
      const hsp             = s.hsp             ?? null;
      const flashbangScore  = s.flashbangScore  ?? null;
      const utilityOnDeath  = s.utilityOnDeathAvg ?? null;
      const sprayAccuracy   = s.sprayAccuracy   ?? null;
      const heDmg           = s.heFoesDamageAvg ?? null;
      const molotovDmg      = s.molotovFoesDamageAvg ?? null;
      const utilityDmg      = (heDmg != null || molotovDmg != null) ? (heDmg??0) + (molotovDmg??0) : null;
      // initialTeamNumber: 3 = CT, 2 = T (confirmed from Leetify API)
      const teamNum = s.initialTeamNumber ?? s.teamNumber ?? s.team_number ?? null;
      const side    = teamNum === 2 ? "ct" : teamNum === 3 ? "t" : null;
      console.log("[Leetify bulk] player", name, "initialTeamNumber:", teamNum, "->", side);
      const steam64 = s.steam64Id || s.steam_64_id || null;
      return { name, steam64, kills, deaths, assists, damage, leetifyRating, hltvRating, reactionTime, kast, counterRatio, counterAll, wastedAmmo, reloads, flashFriend, flashFoe, roundsSurvived, multi2k, multi3k, multi4k, multi5k, tradeKillsSucceeded, accuracy, dpr, mvps, hsp, flashbangScore, utilityOnDeath, sprayAccuracy, utilityDmg, teamNum, side, suggestedId: findBestPlayer(name, steam64) };
    });
    // Derive round score: each team's total rounds won
    const team2p = ps2.find ? ps2.find(s=>(s.initialTeamNumber??s.teamNumber)===2) : null;
    const team3p = ps2.find ? ps2.find(s=>(s.initialTeamNumber??s.teamNumber)===3) : null;
    const team2wins = team2p ? (team2p.ctRoundsWon||0)+(team2p.tRoundsWon||0) : null;
    const team3wins = team3p ? (team3p.ctRoundsWon||0)+(team3p.tRoundsWon||0) : null;
    // ct bucket = team2, t bucket = team3
    const roundScore = (team2wins !== null && team3wins !== null)
      ? { ct: team2wins, t: team3wins } : null;
    return { map, playedAt: new Date(playedAt).getTime() || Date.now(), winner, players, gameId: data.id || data.gameId || "", roundScore };
  });

  // Render one accordion section per match
  const matchSections = parsedMatches.map((m, mi) => {
    const date = new Date(m.playedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    const rows = m.players.map((lp, pi) => {
      const autoSide = lp.side || "ct";
      return `
      <div style="display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:8px;margin-bottom:7px">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text)">${esc(lp.name)}</div>
          <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">${lp.kills}/${lp.deaths}/${lp.assists}</div>
        </div>
        <select data-match="${mi}" data-player="${pi}" data-side-select style="font-size:11px;width:100%;text-align:center">
          <option value="ct"${autoSide==="ct"?" selected":""}>Team 2</option>
          <option value="t"${autoSide==="t"?" selected":""}>Team 3</option>
          <option value="">skip</option>
        </select>
        <select data-match="${mi}" data-player="${pi}" data-roster-select style="font-size:12px;width:100%">
          <option value="">— skip —</option>
          ${state.players.map(p=>`<option value="${esc(p.id)}"${p.id===lp.suggestedId?" selected":""}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>`;
    }).join('');

    return `
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer" data-toggle-match="${mi}">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:8px;height:8px;border-radius:50%;background:${m.winner==='ct'?'#4299E1':'#e53e3e'}"></div>
          <span style="font-weight:700;color:var(--text);font-size:14px">${esc(m.map)}</span>
          <span style="font-size:11px;font-weight:700;color:${m.winner==='ct'?'#4299E1':'#e53e3e'}">${m.winner.toUpperCase()} WIN</span>
        </div>
        <span style="color:var(--muted);font-size:11px;font-family:var(--mono)">${esc(date)} ▾</span>
      </div>
      <div class="bulk-match-body" id="bulk-body-${mi}" style="padding:0 14px 12px;display:none">
        <div style="display:grid;grid-template-columns:1fr 80px 1fr;gap:8px;margin-bottom:6px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted)">
          <div>LEETIFY PLAYER</div><div style="text-align:center">TEAM</div><div>ROSTER PLAYER</div>
        </div>
        ${rows}
      </div>
    </div>`;
  }).join('');

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(580px,95vw)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <h3 style="color:var(--text);font-size:16px">Review & Map Players — ${parsedMatches.length} match${parsedMatches.length>1?"es":""}</h3>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-bottom:14px">Click each match to expand and adjust player mappings. Players not in your roster can be skipped.</p>

    overlay.querySelectorAll("select[data-roster-select]").forEach(sel => {

          if (lp.reactionTime != null)  state.players[idx].matchHistory[histIdx].reactionTime  = lp.reactionTime;

          if (lp.counterAll != null)    state.players[idx].matchHistory[histIdx].counterAll    = lp.counterAll;
          if (lp.wastedAmmo != null)    state.players[idx].matchHistory[histIdx].wastedAmmo    = lp.wastedAmmo;
          if (lp.reloads != null)       state.players[idx].matchHistory[histIdx].reloads       = lp.reloads;
          if (lp.flashFriend != null)   state.players[idx].matchHistory[histIdx].flashFriend   = lp.flashFriend;
          if (lp.flashFoe != null)      state.players[idx].matchHistory[histIdx].flashFoe      = lp.flashFoe;
          if (lp.roundsSurvived != null)state.players[idx].matchHistory[histIdx].roundsSurvived= lp.roundsSurvived;
          if (lp.multi3k != null)       state.players[idx].matchHistory[histIdx].multi3k       = lp.multi3k;
          if (lp.accuracy != null)      state.players[idx].matchHistory[histIdx].accuracy      = lp.accuracy;
          if (lp.dpr != null)           state.players[idx].matchHistory[histIdx].dpr           = lp.dpr;
          if (lp.mvps != null)          state.players[idx].matchHistory[histIdx].mvps          = lp.mvps;
          if (lp.multi2k != null)       state.players[idx].matchHistory[histIdx].multi2k       = lp.multi2k;
          if (lp.multi4k != null)       state.players[idx].matchHistory[histIdx].multi4k       = lp.multi4k;
          if (lp.multi5k != null)       state.players[idx].matchHistory[histIdx].multi5k       = lp.multi5k;
          if (lp.tradeKillsSucceeded != null) state.players[idx].matchHistory[histIdx].tradeKillsSucceeded = lp.tradeKillsSucceeded;
          if (lp.hsp != null)           state.players[idx].matchHistory[histIdx].hsp           = lp.hsp;

          if (lp.utilityOnDeath != null)state.players[idx].matchHistory[histIdx].utilityOnDeath= lp.utilityOnDeath;
          if (lp.sprayAccuracy != null) state.players[idx].matchHistory[histIdx].sprayAccuracy = lp.sprayAccuracy;
          if (lp.utilityDmg != null)   state.players[idx].matchHistory[histIdx].utilityDmg   = lp.utilityDmg;
          // Also update scores entry on the match record
          const side = existing.teams.ct.includes(pid) ? "ct" : "t";
          if (!existing.scores[side]) existing.scores[side] = {};
          if (!existing.scores[side][pid]) existing.scores[side][pid] = {};

  document.getElementById("bulk-map-confirm").addEventListener("click", () => {
    let imported = 0, skipped = 0;
    const importLog = [];

    // Collect both selects (side + roster) keyed by match+player
    const matchMaps = {};   // matchMaps[mi][pi] = { pid, side }
    overlay.querySelectorAll("select[data-roster-select]").forEach(sel => {
      const mi = parseInt(sel.dataset.match);
      const pi = parseInt(sel.dataset.player);
      const pid = sel.value;

      matchMaps[mi][pi] = { pid: pid || "", side: "ct" };
    });
    overlay.querySelectorAll("select[data-side-select]").forEach(sel => {
      const mi = parseInt(sel.dataset.match);
      const pi = parseInt(sel.dataset.player);
      if (matchMaps[mi]?.[pi]) matchMaps[mi][pi].side = sel.value;
    });

    parsedMatches.forEach((m, mi) => {
      const mapping = matchMaps[mi] || {};
      const entries = Object.values(mapping).filter(e=>e.pid && e.side);
      if (!entries.length) { skipped++; importLog.push({map:m.map,status:'skipped',reason:'No players mapped'}); return; }

      // Skip if this gameId already imported
      if (m.gameId && state.matches.some(x=>x.leetifyGameId===m.gameId)) { skipped++; importLog.push({map:m.map,status:'skipped',reason:'Already imported'}); return; }

      // Build teams directly from the explicit side dropdowns
      const ctIds = entries.filter(e=>e.side==="ct").map(e=>e.pid);
      const tIds  = entries.filter(e=>e.side==="t").map(e=>e.pid);

      const matchId = genId();
      const scores  = { ct: {}, t: {} };

      m.players.forEach((lp, pi) => {
        const entry = mapping[pi];
        if (!entry?.pid || !entry?.side || entry.side === "") return;
        scores[entry.side][entry.pid] = { kills: lp.kills, deaths: lp.deaths, assists: lp.assists, damage: lp.damage||0, leetifyRating: lp.leetifyRating??null, hltvRating: lp.hltvRating??null, reactionTime: lp.reactionTime, kast: lp.kast, counterRatio: lp.counterRatio, counterAll: lp.counterAll, wastedAmmo: lp.wastedAmmo, reloads: lp.reloads, flashFriend: lp.flashFriend, flashFoe: lp.flashFoe, roundsSurvived: lp.roundsSurvived, multi3k: lp.multi3k, accuracy: lp.accuracy, dpr: lp.dpr, mvps: lp.mvps };
      });

      // Run ELO adjustments
      const ctPlayers = ctIds.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
      const tPlayers  = tIds.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);

      const processTeam = (team, opp, side) => {
        const oppAvgElo = opp.reduce((a,p)=>a+(p.elo??1000),0)/Math.max(opp.length,1);
        team.forEach(p => {
          const won      = m.winner===side;
          const s        = scores[side][p.id] || {kills:0,deaths:0,assists:0};
          const kd       = s.deaths>0 ? s.kills/s.deaths : s.kills;
          const curElo   = p.elo ?? 1000;
          const eloDelta = calcEloPoints(curElo, oppAvgElo, won, kd);
          const newElo   = Math.max(0, curElo + eloDelta);
          const ts    = tsInit(p);
          const oppTs = { mu: opp.reduce((a,x)=>a+tsInit(x).mu,0)/Math.max(opp.length,1),
                          sigma: opp.reduce((a,x)=>a+tsInit(x).sigma,0)/Math.max(opp.length,1) };
          const newTs = tsUpdate(ts.mu, ts.sigma, oppTs.mu, oppTs.sigma, won, kd);
          const idx = state.players.findIndex(x=>x.id===p.id);
          if (idx>-1) {
            state.players[idx].elo   = newElo;
            state.players[idx].mu    = newTs.mu;
            state.players[idx].sigma = newTs.sigma;
            // rating stays untouched
            state.players[idx].matchHistory = [
              ...(state.players[idx].matchHistory||[]),
              { matchId, won, kills:s.kills, deaths:s.deaths, assists:s.assists, damage:s.damage||0, leetifyRating:s.leetifyRating??null, hltvRating:s.hltvRating??null, reactionTime:s.reactionTime, kast:s.kast, counterRatio:s.counterRatio, counterAll:s.counterAll, wastedAmmo:s.wastedAmmo, reloads:s.reloads, flashFriend:s.flashFriend, flashFoe:s.flashFoe, roundsSurvived:s.roundsSurvived, multi2k:s.multi2k, multi3k:s.multi3k, multi4k:s.multi4k, multi5k:s.multi5k, tradeKillsSucceeded:s.tradeKillsSucceeded, accuracy:s.accuracy, dpr:s.dpr, mvps:s.mvps, hsp:s.hsp, flashbangScore:s.flashbangScore, utilityOnDeath:s.utilityOnDeath, sprayAccuracy:s.sprayAccuracy, utilityDmg:s.utilityDmg, eloDelta }
            ];
          }
        });
      };

      processTeam(ctPlayers, tPlayers, "ct");
      processTeam(tPlayers, ctPlayers, "t");

      state.matches.unshift({
        id: matchId,
        leetifyGameId: m.gameId,
        map: m.map,
        winner: m.winner,
        playedAt: m.playedAt,
        teams: { ct: ctIds, t: tIds },
        scores,
        roundScore: m.roundScore || null,
      });
      importLog.push({map:m.map,status:'imported',reason:`${ctIds.length+tIds.length} players · ${m.winner==='ct'?teamLabel(ctPlayers,'Team 1'):teamLabel(tPlayers,'Team 2')} won`});
      imported++;
    });

    saveData();
    overlay.remove();
    render();

    // Show detailed import log
    const logOverlay = document.createElement("div");
    logOverlay.className = "modal-overlay";
    logOverlay.innerHTML = `
      <div class="modal-box" style="width:min(480px,95vw)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <h3 style="color:var(--text);font-size:16px">Import Complete</h3>
        </div>
        <div style="max-height:400px;overflow-y:auto;margin-bottom:16px">
          ${importLog.map(entry => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:8px;margin-bottom:6px;border:1px solid ${entry.status==='imported'?'#2d5a2d':entry.status==='skipped'?'var(--border)':'#7a1f1f'}">
            <span style="font-size:16px">${entry.status==='imported'?'✅':entry.status==='skipped'?'⏭':'❌'}</span>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:700;color:var(--text)">${esc(entry.map)}</div>
              <div style="font-size:11px;color:var(--muted)">${esc(entry.reason)}</div>
            </div>
          </div>`).join('')}
        </div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:14px">
          <b style="color:#68D391">${imported}</b> imported · <b style="color:var(--muted)">${skipped}</b> skipped
        </div>
        <button class="btn btn-primary" style="width:100%" id="import-log-close">Done</button>
      </div>`;
    document.body.appendChild(logOverlay);
    document.getElementById("import-log-close").addEventListener("click", () => logOverlay.remove());
    logOverlay.addEventListener("click", e => { if(e.target===logOverlay) logOverlay.remove(); });
  });
  } catch(err) {
    console.error("openBulkMapping crashed:", err);
    flash(`Import error: ${err.message} — check console for details`);
  }
}

// ─── Leaderboard ──────────────────────────────────────────────────────────
function playerLeaderboardStats(p) {
  const hist = p.matchHistory || [];
  const matches = hist.length;
  const wins    = hist.filter(m=>m.won).length;
  const kills   = hist.reduce((s,m)=>s+(m.kills||0),0);
  const deaths  = hist.reduce((s,m)=>s+(m.deaths||0),0);
  const assists = hist.reduce((s,m)=>s+(m.assists||0),0);
  const damage  = hist.reduce((s,m)=>s+(m.damage||0), 0);
  const kd      = deaths > 0 ? kills/deaths : kills;
  const wr      = matches > 0 ? wins/matches : 0;
  const lrValues   = hist.map(m=>m.leetifyRating).filter(v=>v!=null);
  const avgLR     = lrValues.length > 0 ? lrValues.reduce((a,b)=>a+b,0)/lrValues.length : null;
  const hltvVals  = hist.map(m=>m.hltvRating).filter(v=>v!=null);
  const avgHLTV   = hltvVals.length > 0 ? hltvVals.reduce((a,b)=>a+b,0)/hltvVals.length : null;
  const rounds  = hist.reduce((s,m)=>{
    const mr = state.matches.find(x=>x.id===m.matchId);
    return s + (mr?.roundScore ? (mr.roundScore.ct + mr.roundScore.t) : 0);
  }, 0);
  const adr     = rounds > 0 ? damage/rounds : 0;
  const kpr     = rounds > 0 ? kills/rounds : 0;
  return { matches, wins, kills, deaths, assists, kd, wr, kpr, adr, elo: p.elo??1000, rounds, avgLR, avgHLTV };
}

function renderLeaderboard() {
  const categories = [
    { id:"lr",   label:"LEETIFY",  desc:"Average Leetify Rating (min 3 matches)",  fmt: s=>s.avgLR!=null?`${(s.avgLR*100)>=0?"+":""}${(s.avgLR*100).toFixed(2)}`:"—", val: s=>(s.avgLR??-99)*100, min:3 },
    { id:"hltv", label:"HLTV",     desc:"Average HLTV Rating 2.0 (min 3 matches)", fmt: s=>s.avgHLTV!=null?s.avgHLTV.toFixed(2):"—", val: s=>s.avgHLTV??-99, min:3 },
    { id:"adr",  label:"ADR",      desc:"Average damage per round (min 3 matches)",fmt: s=>s.adr.toFixed(1),           val: s=>s.adr,      min:3 },
    { id:"elo",  label:"ELO",      desc:"Performance-based ELO rating",          fmt: s=>`${s.elo}`,                   val: s=>s.elo,      min:1 },
    { id:"kd",   label:"K/D",      desc:"Kill/death ratio (min 3 matches)",      fmt: s=>s.kd.toFixed(2),              val: s=>s.kd,       min:3 },
    { id:"wr",   label:"WIN RATE", desc:"Win percentage (min 3 matches)",         fmt: s=>`${(s.wr*100).toFixed(1)}%`, val: s=>s.wr,       min:3 },
  ];

  const activeCat = state.lbCat || "lr";
  const cat = categories.find(c=>c.id===activeCat) || categories[0];

  const eligible = state.players
    .map(p => ({ p, s: playerLeaderboardStats(p) }))
    .filter(({s}) => s.matches >= cat.min)
    .sort((a,b) => cat.val(b.s) - cat.val(a.s));

  const rows = eligible.map(({p, s}, i) => {
    const isTop = i === 0;
    const medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
    const barPct = ((p.rating - 1) / 17 * 100).toFixed(1);
    const rc = rankColor(p.rating);
    const eloNet = s.elo - 1000;
    const eloColor = eloNet>=0?"#68D391":"#fc8181";
    return `
    <div style="display:grid;grid-template-columns:28px 36px 1fr auto auto;align-items:center;gap:12px;
      padding:12px 16px;background:${isTop?'var(--bg3)':'var(--bg2)'};
      border:1px solid ${isTop?'var(--border2)':'var(--border)'};
      border-radius:12px;margin-bottom:8px;cursor:pointer"
      data-player-profile="${esc(p.id)}">
      <div style="font-size:${medal?'18':'13'}px;text-align:center;color:var(--muted);font-weight:700">${medal||i+1}</div>
      <div style="width:36px;height:40px;flex-shrink:0">${rankBadgeSVG(p.rating,rc)}</div>
      <div>
        <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(p.name)}</div>
        <div style="margin-top:4px;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;max-width:200px">
          <div style="width:${barPct}%;height:100%;background:${rc};border-radius:2px;transition:width .3s"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">
          W/L ${s.wins}/${s.matches-s.wins} · K/D ${s.kd.toFixed(2)} · ELO <span style="color:${eloColor}">${s.elo}</span>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:800;color:${rc};font-family:var(--mono)">${cat.fmt(s)}</div>
        <div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px">${cat.label}</div>
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:right;min-width:48px">${s.matches} match${s.matches!==1?'es':''}</div>
    </div>`;
  }).join('') || `<div style="color:var(--muted);text-align:center;padding:40px 0;font-size:14px">No players with enough matches yet</div>`;

  const tabs = categories.map(c=>`
    <button class="lb-tab${c.id===activeCat?' lb-tab-active':''}" data-lb-cat="${c.id}"
      style="padding:8px 16px;background:${c.id===activeCat?'var(--bg3)':'transparent'};
      border:1px solid ${c.id===activeCat?'var(--border2)':'transparent'};
      border-radius:8px;color:${c.id===activeCat?'var(--text)':'var(--muted)'};
      font-family:var(--font);font-weight:700;font-size:12px;letter-spacing:1.5px;cursor:pointer;transition:all .15s">
      ${c.label}
    </button>`).join('');

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">

      <div style="font-size:12px;color:var(--muted);margin-top:3px">${cat.desc}</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${tabs}</div>
  </div>
  <div id="lb-list">${rows}</div>`;
}

          </div>
          <div style="text-align:center">
            <div style="font-size:15px;font-weight:700;color:${rc}">${p.rating.toFixed(1)}</div>
            <div style="font-size:10px;color:var(--muted);letter-spacing:1px">MANUAL</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:15px;font-weight:700;color:${hc}">${hiddenRank.toFixed(1)}</div>
            <div style="font-size:10px;color:var(--muted);letter-spacing:1px">HIDDEN</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:14px;font-weight:700;color:${diffColor}">${diff>=0?"+":""}${diff.toFixed(1)}</div>
            <div style="font-size:10px;color:var(--muted);letter-spacing:1px">DIFF</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:14px;font-weight:700;color:var(--text)">${conf}%</div>
            <div style="font-size:10px;color:var(--muted);letter-spacing:1px">CONF</div>
          </div>
        </div>`;
      }).join('');
    return `
    <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:10px;font-family:var(--mono)">ALL PLAYERS — HIDDEN RATINGS</div>
    ${rows}
    <div style="margin:24px 0 10px;border-top:1px solid var(--border)"></div>
    <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:10px;font-family:var(--mono)">SUGGESTED ADJUSTMENTS</div>`;
  })() : '';

  const suggRows = suggestions.length === 0 ? `
    <div class="empty-state" style="padding-top:${READONLY?'40':'20'}px">
      <span class="empty-icon">✅</span>
      <p>No adjustments needed yet</p>
      <small>Keep playing — suggestions appear when a player's hidden rating drifts from their manual rating</small>
    </div>` : suggestions.map(s => `
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px">
      <div style="flex:1">
        <div style="font-size:16px;font-weight:700;color:var(--text)">${esc(s.name)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">
          ${TRUST_LEVEL >= 2 ? `Hidden rating: <b style="color:var(--text)">${s.hiddenRank.toFixed(1)}</b> · ` : ''}ELO drift: <b style="color:${s.eloDrift>=0?'#68D391':'#fc8181'}">${s.eloDrift>=0?'+':''}${Math.round(s.eloDrift)}</b>${!READONLY ? ` · Confidence: <b style="color:var(--text)">${s.confidence}%</b>` : ''}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-family:var(--mono)">
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:700;color:${rankColor(s.current)}">${s.current.toFixed(1)}</div>
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px">CURRENT</div>
        </div>
        <div style="font-size:22px;color:${s.up?'#68D391':'#fc8181'}">${s.up?"⬆":"⬇"}</div>
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:800;color:${rankColor(s.suggested)}">${s.suggested.toFixed(1)}</div>
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px">SUGGESTED</div>
        </div>
      </div>
      ${TRUST_LEVEL >= 2 ? `<button class="btn btn-ghost" data-apply-suggestion="${esc(s.id)}" data-suggested-rating="${s.suggested}"
        style="font-size:12px;padding:8px 14px;border-color:${s.up?'#68D391':'#fc8181'};color:${s.up?'#68D391':'#fc8181'}">
        APPLY
      </button>` : `<div style="font-size:11px;color:var(--muted)">${TRUST_LEVEL===1?'Admin only':''}</div>`}
    </div>`).join('');

  return `
  <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">RANK ADJUSTMENT SUGGESTIONS</div>
  <div style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6">
    Team balancing uses manually set skill ratings. ELO tracks performance over time and is used to suggest adjustments.
  </div>
  ${allPlayersTable}
  ${suggRows}`;
}

function bindRankings() {
  document.querySelectorAll("[data-apply-suggestion]").forEach(btn => {
    btn.addEventListener("click", () => {
      const pid = btn.dataset.applySuggestion;
      const newRating = parseFloat(btn.dataset.suggestedRating);
      const idx = state.players.findIndex(p=>p.id===pid);
      if (idx > -1) {
        const old = state.players[idx].rating;
        logRatingChange(pid, old, newRating, "rank_suggestion");
        state.players[idx].rating = newRating;
        state.players[idx].elo    = 1000;
        state.players[idx].mu     = newRating * TS_MU_SCALE;
        state.players[idx].sigma  = TS_SIGMA_INIT;
        saveData(); render();
        flash(`${state.players[idx].name} rating ${old.toFixed(1)} → ${newRating.toFixed(1)} · ELO reset`);
      }
    });
  });
}

// ─── Post-match awards ────────────────────────────────────────────────────
function openMatchAwards(matchId) {
  const match = state.matches.find(m=>m.id===matchId);
  if (!match) return;

  // Build a merged stats object: scores entry + matchHistory entry
  const getStats = (pid) => {
    const side = match.teams.ct.includes(pid) ? "ct" : "t";
    const scoreEntry = match.scores?.[side]?.[pid] || {};
    const p = state.players.find(x=>x.id===pid);
    const histEntry = (p?.matchHistory||[]).find(h=>h.matchId===match.id) || {};
    // Merge: start with histEntry, then only overwrite with scoreEntry values that are not null/undefined
    const merged = { ...histEntry };
    Object.entries(scoreEntry).forEach(([k,v]) => { if (v != null) merged[k] = v; });
    return merged;
  };

  // Collect all players and their stats for this match
  const allIds = [...(match.teams.ct||[]), ...(match.teams.t||[])];
  const players = allIds.map(id => {
    const p = state.players.find(x=>x.id===id);
    if (!p) return null;
    const s = getStats(id);
    // Ensure kills/deaths/assists are always available from matchHistory if not in scores
    const hist = (p.matchHistory||[]).find(h=>h.matchId===match.id)||{};
    return { id, name: p.name, ...s,
      kills:   s.kills   ?? hist.kills   ?? 0,
      deaths:  s.deaths  ?? hist.deaths  ?? 0,
      assists: s.assists ?? hist.assists ?? 0,
    };
  }).filter(Boolean);

  if (players.length === 0) { flash("No player stats available for awards"); return; }

  // Award definitions — each gets assigned to exactly one player
  // Special award: Mecha Menace
  const rounds = match.roundScore ? (match.roundScore.ct + match.roundScore.t) : null;
  const mechaMenaceWinner = (() => {
    const qualified = players.filter(p => {
      const adr = p.dpr != null ? p.dpr : (rounds && p.damage ? p.damage / rounds : null);
      return (adr != null && adr >= 150) || (p.hltvRating != null && p.hltvRating >= 2.2);
    });
    if (!qualified.length) return null;
    // Pick highest performer: prefer HLTV rating as primary sort, ADR as secondary
    return qualified.sort((a,b) => {
      const aHltv = a.hltvRating ?? 0, bHltv = b.hltvRating ?? 0;
      if (bHltv !== aHltv) return bHltv - aHltv;
      const aAdr = a.dpr ?? (rounds&&a.damage?a.damage/rounds:0);
      const bAdr = b.dpr ?? (rounds&&b.damage?b.damage/rounds:0);
      return bAdr - aAdr;
    })[0];
  })();

  // priority: lower = more prestigious. Titles are fun/achievement-style, not absolute superlatives.
  const AWARDS = [
    { id:"ace",      emoji:"🃏", title:"Ace!",               desc:"Wiped the floor — alone",          pri:1,  val: p=>p.multi5k>0?p.multi5k:-999,                                                     higher:true },
    { id:"hltv",     emoji:"🏆", title:"Certified Fragger",  desc:"HLTV would be proud",              pri:2,  val: p=>p.hltvRating??0,                                                 higher:true },
    { id:"react",    emoji:"⚡", title:"Stim Abuser",        desc:"Already clicking before you peek", pri:3,  val: p=>p.reactionTime!=null?-p.reactionTime:-999,                       higher:true },
    { id:"multi4k",  emoji:"💣", title:"Quad Kill",          desc:"Four down, one spared",            pri:4,  val: p=>((p.multi4k??0)+(p.multi5k??0))>0?(p.multi4k??0)+(p.multi5k??0):-999,  higher:true },
    { id:"leetify",  emoji:"📈", title:"Leetify Legend",     desc:"Leetify says you cooked",          pri:5,  val: p=>p.leetifyRating??-99,                                            higher:true },
    { id:"multi2k",  emoji:"🥊", title:"Double Tap",         desc:"Most 2K rounds",                   pri:7,  val: p=>p.multi2k>0?p.multi2k:-999,                                                    higher:true },
    { id:"multi3k",  emoji:"🎩", title:"Hat Trick",          desc:"Dropping multis like it's easy",   pri:6,  val: p=>p.multi3k>0?p.multi3k:-999,                                                    higher:true },
    { id:"trade",    emoji:"⚔️", title:"Eye for an Eye",     desc:"You kill mine, I kill yours",      pri:7,  val: p=>p.tradeKillsSucceeded>0?p.tradeKillsSucceeded:-999,                                        higher:true },
    { id:"ctstrafe", emoji:"🕺", title:"Movement Player",    desc:"Stopping to shoot since day one",  pri:8,  val: p=>(p.counterRatio!=null&&p.counterRatio>0)?p.counterRatio:-999,    higher:true },
    { id:"damage",   emoji:"💥", title:"Walking Weapon",     desc:"Someone was cooking this match",   pri:9,  val: p=>p.damage??0,                                                     higher:true },
    { id:"flash",    emoji:"🔦", title:"Blind Faith",        desc:"Enemies saw white all game",       pri:10, val: p=>p.flashbangScore!=null?p.flashbangScore:(p.flashFoe>0?p.flashFoe:-999),         higher:true },
    { id:"assists",  emoji:"🤲", title:"Team Effort",        desc:"Most assists",                     pri:14, val: p=>(p.assists??p.a??0)>0?(p.assists??p.a??0):-999,                                          higher:true },
    { id:"survive",  emoji:"🪳", title:"Cockroach",          desc:"Unkillable. Inexplicably.",         pri:13, val: p=>p.roundsSurvived??0,                                             higher:true },
    { id:"kast",     emoji:"💪", title:"Always Present",     desc:"Highest KAST%",               pri:12, val: p=>p.kast!=null?p.kast:-999,                                                      higher:true },
    { id:"mvp",      emoji:"⭐", title:"Round Winner",       desc:"Clutching when it counted",        pri:13, val: p=>p.mvps>0?p.mvps:-999,                                                       higher:true },
    { id:"lowdmg",   emoji:"👻", title:"I Was There",        desc:"Ghost on the scoreboard",          pri:14, val: p=>-(p.damage??999),                                                higher:true },
    { id:"deaths",   emoji:"💀", title:"Bullet Sponge",      desc:"Absorbing enemy attention",   pri:23, val: p=>p.deaths>0?p.deaths:-999,                                                     higher:true },
    { id:"lowleet",  emoji:"📉", title:"Leetify Victim",     desc:"Leetify has thoughts. Not good ones.", pri:16, val: p=>p.leetifyRating!=null?-p.leetifyRating:-999,               higher:true },
    { id:"hsp",      emoji:"🎯", title:"Headhunter",          desc:"Aim for the head, always",         pri:17, val: p=>p.hsp!=null?p.hsp:-999,                                          higher:true },
    { id:"utility_dmg", emoji:"🧨", title:"Utility King",      desc:"Highest utility damage",           pri:15, val: p=>p.utilityDmg!=null&&p.utilityDmg>0?p.utilityDmg:-999,               higher:true },
    { id:"spray",    emoji:"💦", title:"Spray Artist",        desc:"Highest spray accuracy",            pri:18, val: p=>p.sprayAccuracy!=null?p.sprayAccuracy:-999,                      higher:true },
    { id:"ffriend",  emoji:"😵", title:"Sorry Guys",          desc:"Most team flashes",                pri:19, val: p=>p.flashFriend>0?p.flashFriend:-999,                                               higher:true },
    { id:"lowkast",  emoji:"📺", title:"Spectator Mode",     desc:"Lowest KAST%",                     pri:20, val: p=>p.kast!=null?-p.kast:-999,                                      higher:true },
    { id:"utility",  emoji:"🎒", title:"Hoarder",             desc:"Died with a full utility belt",    pri:21, val: p=>p.utilityOnDeath!=null?p.utilityOnDeath:-999,                   higher:true },
    { id:"spin",     emoji:"🌀", title:"Spinning Top",       desc:"Shooting mid-strafe, always",      pri:22, val: p=>(p.counterRatio!=null&&p.counterRatio>0)?-p.counterRatio:-999,   higher:true },
  ];

  // ── Award assignment ──────────────────────────────────────────────────────
  // Rule: every award belongs EXCLUSIVELY to the player who ranked #1 in that stat.
  // If that player wins multiple awards, they keep their BEST one.
  // Other awards go unassigned rather than to the wrong person.
  // Then unawarded players get filled from leftover awards.

  const GOOD_AWARDS  = AWARDS.filter(a => !["lowdmg","deaths","ffriend","lowkast","spin","lowleet","utility"].includes(a.id));
  const SHAME_AWARDS = AWARDS.filter(a =>  ["lowdmg","deaths","ffriend","lowkast","spin","lowleet","utility"].includes(a.id));
  const SHAME_IDS    = new Set(SHAME_AWARDS.map(a=>a.id));

  // Step 1: find the true #1 winner for every award
  const trueWinner = new Map(); // awardId -> playerId
  AWARDS.forEach(award => {
    const ranked = [...players].sort((a,b) => award.val(b) - award.val(a));
    const top = ranked[0];
    if (!top) return;
    const val = award.val(top);
    if (val === -999) return;
    if (!SHAME_IDS.has(award.id) && val === 0) return;
    trueWinner.set(award.id, top.id);
  });

  // Step 2: for each player, collect all awards they are the true winner of
  const playerWins = new Map(); // playerId -> award[]
  players.forEach(p => { playerWins.set(p.id, []); });
  trueWinner.forEach((pid, awardId) => {
    const award = AWARDS.find(a=>a.id===awardId);
    if (award) playerWins.get(pid)?.push(award);
  });

  // Step 3: each player keeps only their single BEST award
  // Good awards beat shame awards. Bullet Sponge (deaths) is never given to
  // someone who is the true #1 in ANY good award stat (even if that stat has no data).
  const assigned = new Map();
  const usedAwards = new Set();

  // Pre-assign Mecha Menace FIRST before any other awards
  if (mechaMenaceWinner) {
    assigned.set(mechaMenaceWinner.id, { id:"mecha", emoji:"🤖", title:"Actually Hitler", desc:"150+ ADR or 2.2+ HLTV", pri:0, isMecha:true });
    usedAwards.add("mecha");
  }

  // Build set of players who are true #1 in at least one good stat (even if val=-999)
  const goodStatLeaders = new Set();
  GOOD_AWARDS.forEach(award => {
    const ranked = [...players].sort((a,b) => award.val(b) - award.val(a));
    if (ranked[0] && award.val(ranked[0]) !== -999) goodStatLeaders.add(ranked[0].id);
    // Also mark as leader if they rank #1 regardless of val (they dominate this stat)
    if (ranked[0]) goodStatLeaders.add(ranked[0].id);
  });

  players.forEach(p => {
    const wins = playerWins.get(p.id) || [];
    if (!wins.length) return;
    if (assigned.has(p.id)) return; // already assigned (e.g. mecha menace)
    const sorted = wins.sort((a,b) => {
      const aShame = SHAME_IDS.has(a.id) ? 1 : 0;
      const bShame = SHAME_IDS.has(b.id) ? 1 : 0;
      if (aShame !== bShame) return aShame - bShame;
      return (a.pri||99) - (b.pri||99);
    });
    // If player's only win is Bullet Sponge but they lead any good stat, skip it
    const best = sorted[0];
    if (best.id === "deaths" && goodStatLeaders.has(p.id)) return;
    assigned.set(p.id, best);
    usedAwards.add(best.id);
  });

  // Step 4: first pass — give leftover awards to their true #1 if unawarded
  const leftoverAwards = AWARDS.filter(a => !usedAwards.has(a.id));
  leftoverAwards.forEach(award => {
    const ranked = [...players].sort((a,b) => award.val(b) - award.val(a));
    const trueTop = ranked[0];
    if (!trueTop || award.val(trueTop) === -999) return;
    if (!SHAME_IDS.has(award.id) && award.val(trueTop) <= 0) return;
    if (!assigned.has(trueTop.id)) {
      assigned.set(trueTop.id, award);
      usedAwards.add(award.id);
    }
  });

  // Step 5: second pass — any player still unawarded gets the leftover award
  // they rank best in (runner-up style). Titles are already worded to fit this.
  const stillLeftover = AWARDS.filter(a => !usedAwards.has(a.id));
  players.forEach(p => {
    if (assigned.has(p.id)) return;
    if (!stillLeftover.length) {
      assigned.set(p.id, { emoji:"🎮", title:"Just Vibing", desc:"Showed up and played" });
      return;
    }
    let bestAward = null, bestRank = Infinity;
    stillLeftover.forEach(award => {
      if (award.val(p) === -999) return; // skip awards this player has no valid stat for
      const rank = [...players].sort((a,b) => award.val(b) - award.val(a)).findIndex(x=>x.id===p.id);
      if (rank < bestRank) { bestRank = rank; bestAward = award; }
    });
    if (!bestAward) bestAward = { emoji:"🎮", title:"Just Vibing", desc:"Showed up and played" };
    assigned.set(p.id, bestAward);
    stillLeftover.splice(stillLeftover.indexOf(bestAward), 1);
    usedAwards.add(bestAward.id);
  });


  // Split players by team
  const ctPlayers = players.filter(p => match.teams.ct.includes(p.id));
  const tPlayers  = players.filter(p => match.teams.t.includes(p.id));

  const renderTeamCards = (teamPlayers) => teamPlayers.map(p => {
    const award = assigned.get(p.id) || { emoji:"🎮", title:"Just Vibing", desc:"Participated" };
    const s = getStats(p.id);
    const rc = rankColor(state.players.find(x=>x.id===p.id)?.rating||5);
    let statVal = "";
    if (award.id==="damage") {
      const rd = match.roundScore ? (match.roundScore.ct + match.roundScore.t) : 0;
      statVal = s.dpr != null ? `${s.dpr.toFixed(1)} ADR` : rd > 0 && s.damage ? `${(s.damage/rd).toFixed(1)} ADR` : `${s.damage||0} dmg`;
    }
    else if (award.id==="hltv")      statVal = s.hltvRating?.toFixed(2)||"";
    else if (award.id==="mecha") {
      const rd2 = match.roundScore?(match.roundScore.ct+match.roundScore.t):0;
      const adr2=s.dpr!=null?s.dpr.toFixed(1):(rd2>0&&s.damage?(s.damage/rd2).toFixed(1):null);
      const lr2=s.hltvRating!=null?"HLTV "+s.hltvRating.toFixed(2):null;
      statVal=[adr2?"ADR "+adr2:"",lr2?lr2:""].filter(Boolean).join("<br>");
    }
    else if (award.id==="hsp")       statVal = s.hsp!=null?`${(s.hsp*100).toFixed(0)}% HS`:""
    else if (award.id==="assists")  statVal = `${s.assists||0} assists`;
    else if (award.id==="spray")     statVal = s.sprayAccuracy!=null?`${(s.sprayAccuracy*100).toFixed(0)}% spray acc`:"";
    else if (award.id==="utility_dmg") statVal = s.utilityDmg!=null?`${s.utilityDmg.toFixed(1)} avg util dmg`:"";
    else if (award.id==="utility")   statVal = s.utilityOnDeath!=null?`$${s.utilityOnDeath.toFixed(0)} avg utility`:"";
    else if (award.id==="flash")     statVal = s.flashbangScore!=null?`${s.flashbangScore.toFixed(2)} score`:(s.flashFoe!=null?`${s.flashFoe} flashes`:"");
    else if (award.id==="leetify") statVal = s.leetifyRating!=null?`${(s.leetifyRating*100)>=0?"+":""}${(s.leetifyRating*100).toFixed(2)}`:"";
    else if (award.id==="lowleet") statVal = s.leetifyRating!=null?`${(s.leetifyRating*100)>=0?"+":""}${(s.leetifyRating*100).toFixed(2)}`:"";
    else if (award.id==="react") statVal = s.reactionTime ? `${(s.reactionTime*1000).toFixed(0)}ms` : "";
    else if (award.id==="flash") statVal = `${s.flashFoe||0} flashes`;
    else if (award.id==="trade") statVal = `${s.tradeKillsSucceeded||0} trade kills`;
    else if (award.id==="multi2k") statVal = `${s.multi2k||0} 2K round${(s.multi2k||0)!==1?'s':''}` ;
    else if (award.id==="multi3k") statVal = `${s.multi3k||0} 3K round${(s.multi3k||0)!==1?'s':''}`;
    else if (award.id==="multi4k") statVal = `${(s.multi4k||0)+(s.multi5k||0)} 4K+ round${((s.multi4k||0)+(s.multi5k||0))!==1?'s':''}`;
    else if (award.id==="ace")     statVal = (s.multi5k>0)?`${s.multi5k} ace${s.multi5k!==1?'s':''}`:"—";
    else if (award.id==="ctstrafe") statVal = s.counterRatio ? `${(s.counterRatio*100).toFixed(0)}%` : "";
    else if (award.id==="survive") statVal = `${s.roundsSurvived||0} rounds`;
    else if (award.id==="kast" || award.id==="lowkast") statVal = s.kast ? `${(s.kast*100).toFixed(0)}%` : "";
    else if (award.id==="mvp")  statVal = `${s.mvps||0} ⭐`;
    else if (award.id==="lowdmg") {
      const rd = match.roundScore ? (match.roundScore.ct + match.roundScore.t) : 0;
      statVal = s.dpr != null ? `${s.dpr.toFixed(1)} ADR` : rd > 0 && s.damage ? `${(s.damage/rd).toFixed(1)} ADR` : `${s.damage||0} dmg`;
    }
    else if (award.id==="deaths") statVal = `${s.deaths||0} deaths`;
    else if (award.id==="ammo") statVal = `${s.wastedAmmo||0} wasted`;
    else if (award.id==="reload") statVal = `${s.reloads||0} reloads`;
    else if (award.id==="ffriend") statVal = `${s.flashFriend||0} friendlies`;
    else if (award.id==="spray") statVal = s.accuracy ? `${(s.accuracy*100).toFixed(1)}%` : "";
    else if (award.id==="spin") statVal = s.counterRatio ? `${(s.counterRatio*100).toFixed(0)}%` : "";
    const funny = SHAME_IDS.has(award.id);
    return `
    <div style="background:${award.isMecha?(p.won?'#1a1a00':'#f0ead8'):funny?'var(--bg3)':'var(--bg3)'};border:${award.isMecha?('2px solid '+(p.won?'#FFD700':'#888')):"1px solid "+(funny?'#7a1f1f44':'var(--border)')};border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px;height:100%;box-sizing:border-box;min-width:0;word-break:break-word;min-height:200px;animation:${award.isMecha&&p.won?'mecha-pulse 2s ease-in-out infinite':'none'}">
      ${award.isMecha ? (p.won ? MECHA_SVG : HITLER_DEAD_SVG) : `<div style='font-size:28px;line-height:1'>${award.emoji}</div>`}
      <div style="font-size:13px;font-weight:800;color:${award.isMecha?(p.won?'#FFD700':'#111'):funny?'#fc8181':rc};letter-spacing:0.5px;text-transform:uppercase;line-height:1.3">${esc(award.title)}</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.3">${esc(award.desc)}</div>
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-top:4px">${esc(p.name)}</div>
      ${statVal ? `<div style="font-size:16px;font-weight:700;color:${funny?'#fc8181':'#68D391'};font-family:var(--mono)">${award.id==='mecha'?statVal:esc(statVal)}</div>` : ''}
    </div>`;
  }).join('');

  const winTeam = match.winner==="ct" ? ctPlayers : tPlayers;
  const loseTeam = match.winner==="ct" ? tPlayers : ctPlayers;
  const winLabel = teamLabel(winTeam.map(p=>state.players.find(x=>x.id===p.id)).filter(Boolean), "Team 1");
  const loseLabel = teamLabel(loseTeam.map(p=>state.players.find(x=>x.id===p.id)).filter(Boolean), "Team 2");

  // Build debug table data (admin only)
  const debugAwards = [...GOOD_AWARDS, ...SHAME_AWARDS];
  const debugRows = players.map(p => {
    const award = assigned.get(p.id);
    const cells = debugAwards.map(a => {
      const ranked = [...players].sort((x,y) => a.val(y) - a.val(x));
      const rank = ranked.findIndex(x=>x.id===p.id) + 1;
      const val = a.val(p);
      const isAssigned = award?.id === a.id;
      const valDisplay = val === -999 ? "—" : Math.abs(val) < 1 ? val.toFixed(2) : Math.round(val);
      return `<td style="text-align:center;padding:4px 6px;background:${isAssigned?'#1a3a1a':'transparent'};color:${rank===1?'#68D391':rank<=3?'var(--text)':'var(--muted)'};border:1px solid var(--border)">${rank}${isAssigned?'★':''}<br><span style="font-size:9px;color:var(--muted)">${valDisplay}</span></td>`;
    }).join('');
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:4px 8px;color:var(--text);white-space:nowrap">${esc(p.name)}</td>
      ${cells}
      <td style="padding:4px 8px;color:#68D391">${award?.emoji||''} ${esc(award?.title||'—')}</td>
    </tr>`;
  }).join('');

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(860px,96vw);max-height:90vh;overflow-y:auto;overflow-x:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div style="font-size:20px;font-weight:800;color:var(--text)">🏅 Match Awards</div>
        <div style="font-size:13px;color:var(--muted)">${esc(match.map)}${match.roundScore?` · ${match.roundScore.ct}:${match.roundScore.t}`:""}</div>
      </div>

      <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:#68D391;margin-bottom:10px;font-family:var(--mono)">★ ${esc(winLabel.toUpperCase())} — WIN</div>
      <div style="display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;margin-bottom:20px;justify-items:stretch">
        ${renderTeamCards(winTeam)}
      </div>

      <div style="border-top:1px solid var(--border);margin-bottom:16px"></div>

      <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:10px;font-family:var(--mono)">${esc(loseLabel.toUpperCase())} — LOSS</div>
      <div style="display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;margin-bottom:16px;justify-items:stretch">
        ${renderTeamCards(loseTeam)}
      </div>

      ${TRUST_LEVEL >= 2 ? `
      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:10px;font-family:var(--mono)">⚙ ADMIN: AWARD ASSIGNMENT DEBUG</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Shows every player's ranking in each stat category. The award assigned is shown in green.</div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:11px;font-family:var(--mono)">
            <thead>
              <tr style="border-bottom:1px solid var(--border)">
                <th style="text-align:left;padding:4px 8px;color:var(--muted)">PLAYER</th>
                ${debugAwards.map(a=>`<th style="text-align:center;padding:4px 6px;color:var(--muted);white-space:nowrap">${a.emoji}</th>`).join('')}
                <th style="text-align:left;padding:4px 8px;color:var(--muted)">ASSIGNED</th>
              </tr>
            </thead>
            <tbody>
              ${debugRows}
            </tbody>
          </table>
        </div>
      </div>` : ''}
      <button class="btn btn-ghost" style="width:100%;margin-top:16px" id="awards-close">Close</button>
    </div>`;;
  document.body.appendChild(overlay);
  document.getElementById("awards-close").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });
}
