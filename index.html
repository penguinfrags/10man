<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CS2 Pickup Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg0: #05080f;
    --bg1: #090e18;
    --bg2: #0e1623;
    --bg3: #141e2e;
    --bg4: #1a2640;
    --border: #1e2d42;
    --border2: #243450;
    --text: #dde6f0;
    --muted: #5a7080;
    --muted2: #3a5060;
    --red: #e53e3e;
    --red-dim: #7a1f1f;
    --blue: #4299e1;
    --blue-dim: #1a3060;
    --green: #48bb78;
    --amber: #ecc94b;
    --purple: #b794f4;
    --font: 'Exo 2', sans-serif;
    --mono: 'Share Tech Mono', monospace;
  }

  html, body { height: 100%; background: var(--bg0); color: var(--text); font-family: var(--font); overflow: hidden; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── Header ── */
  #header {
    display: flex; align-items: center; gap: 16px;
    padding: 0 clamp(20px, 2.5vw, 48px); height: clamp(64px, 5vw, 80px);
    background: var(--bg1);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { font-size: clamp(20px, 2vw, 32px); font-weight: 800; color: var(--red); letter-spacing: 4px; }
  .logo-sep { color: var(--border2); font-size: clamp(18px, 1.6vw, 26px); }
  .logo-title { font-size: clamp(15px, 1.4vw, 22px); font-weight: 600; letter-spacing: 2px; color: var(--text); }
  #header-stats { margin-left: auto; color: var(--muted); font-size: clamp(12px, 0.9vw, 15px); font-family: var(--mono); }

  /* ── Nav ── */
  #nav {
    display: flex; background: var(--bg1);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(20px, 2.5vw, 48px); flex-shrink: 0;
  }
  .nav-btn {
    padding: clamp(14px, 1.3vw, 22px) clamp(18px, 1.8vw, 32px); background: none; border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted); cursor: pointer;
    font-family: var(--font); font-weight: 700; font-size: clamp(16px, 1.4vw, 22px); letter-spacing: 2px;
    transition: color .15s, border-color .15s;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--text); border-bottom-color: var(--red); }

  /* ── Main content ── */
  #content { flex: 1; overflow-y: auto; padding: clamp(16px, 2vw, 40px); }

  /* ── Scrollbar ── */
  #content::-webkit-scrollbar { width: 6px; }
  #content::-webkit-scrollbar-track { background: var(--bg1); }
  #content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── Flash ── */
  #flash {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 10px; padding: 10px 22px;
    color: var(--text); font-size: 14px; font-weight: 600; letter-spacing: .5px;
    z-index: 9999; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Modal overlay ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 9000;
  }
  .modal-box {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 16px; padding: 28px;
    width: min(480px, 95vw); max-height: 90vh; overflow-y: auto;
  }
  .modal-title { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .modal-title h3 { color: var(--text); font-size: 16px; }
  .modal-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── Cards ── */
  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: clamp(16px, 1.5vw, 28px) clamp(18px, 1.8vw, 30px);
    transition: border-color .15s;
  }
  .card.clickable:hover { border-color: var(--border2); cursor: pointer; }
  .card.in-lobby { background: #0f1e10; border-color: #1e4020; }
  .card.in-lobby:hover { border-color: #2a5a2a; }

  /* ── Player card ── */
  .player-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .player-name { font-size: clamp(16px, 1.4vw, 24px); font-weight: 700; color: var(--text); }
  .player-role { font-size: clamp(13px, 1vw, 17px); color: var(--muted); margin-top: 2px; }
  .player-rank-label { font-size: 17px; font-weight: 700; }
  .player-rank-val { font-size: 14px; color: var(--muted); font-family: var(--mono); }
  .rating-bar-track { height: 3px; background: var(--bg4); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .rating-bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
  .player-stats { display: flex; gap: 14px; font-size: clamp(13px, 1vw, 17px); color: var(--muted); flex-wrap: wrap; }
  .player-stats b { color: var(--text); }
  .lobby-indicator { margin-top: 8px; font-size: 12px; font-weight: 700; }

  /* ── Grid ── */
  .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(280px, 22vw, 380px), 1fr)); gap: clamp(10px, 1vw, 18px); }

  /* ── Inputs / buttons ── */
  input, select, textarea {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; padding: clamp(7px, 0.6vw, 11px) clamp(10px, 0.9vw, 14px);
    color: var(--text); font-family: var(--font); font-size: clamp(13px, 0.9vw, 16px);
    outline: none; transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--blue); }
  input[type=range] {
    background: none; border: none; padding: 4px 0;
    accent-color: var(--red); cursor: pointer;
  }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: clamp(8px, 0.7vw, 12px) clamp(14px, 1.2vw, 22px); border-radius: 10px;
    font-family: var(--font); font-weight: 700; font-size: clamp(13px, 0.9vw, 16px); letter-spacing: 1px;
    cursor: pointer; transition: opacity .15s, transform .1s; border: none;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { background: var(--bg4); color: var(--muted); cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--blue); color: var(--text); }
  .btn-icon { padding: 6px 9px; background: var(--bg3); border: 1px solid var(--border); color: var(--muted); font-size: 14px; border-radius: 7px; }
  .btn-icon:hover { color: var(--text); border-color: var(--border2); }
  .btn-icon.danger:hover { color: #fc8181; border-color: #7a1f1f; }

  /* ── Section labels ── */
  .sec-label { font-size: clamp(12px, 0.9vw, 15px); font-weight: 700; letter-spacing: 2px; color: var(--muted); margin-bottom: 12px; font-family: var(--mono); }

  /* ── Team columns ── */
  .teams-row { display: flex; gap: 14px; }
  .team-col { flex: 1; min-width: 0; border-radius: 14px; padding: 18px; border: 1px solid; }
  .team-col.ct { background: var(--bg2); border-color: rgba(66,153,225,.25); }
  .team-col.t  { background: var(--bg2); border-color: rgba(229,62,62,.25); }
  .team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .team-label { font-size: 18px; font-weight: 800; letter-spacing: 3px; }
  .team-avg { font-size: 12px; color: var(--muted); }
  .team-player-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; background: var(--bg3); border-radius: 8px; margin-bottom: 7px;
  }
  .tpr-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .tpr-role { font-size: 11px; color: var(--muted); }
  .tpr-rank { font-size: 12px; font-weight: 600; }

  /* ── Map buttons ── */
  .map-btn {
    padding: 10px 18px; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: 10px;
    color: var(--text); font-family: var(--font); font-weight: 700;
    font-size: 13px; letter-spacing: 2px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .map-btn:hover { background: var(--bg4); border-color: var(--blue); color: var(--blue); }

  /* ── Win buttons ── */
  .win-btn {
    flex: 1; padding: 18px; border-radius: 12px;
    font-family: var(--font); font-weight: 800; font-size: 20px; letter-spacing: 3px;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .win-btn:active { transform: scale(.97); }
  .win-btn.ct { background: var(--blue-dim); border: 2px solid var(--blue); color: var(--blue); }
  .win-btn.t  { background: var(--red-dim); border: 2px solid var(--red); color: var(--red); }
  .win-btn:hover { opacity: .85; }

  /* ── Lobby tag ── */
  .lobby-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: #0f1e10; border: 1px solid #2a5a2a;
    border-radius: 20px; padding: 5px 12px;
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .lobby-tag-dot { width: 8px; height: 8px; border-radius: 50%; }
  .lobby-tag-x {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 0 0 4px;
  }
  .lobby-tag-x:hover { color: #fc8181; }

  /* ── History card ── */
  .hist-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; }
  .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .hist-badge { padding: 5px 14px; border-radius: 20px; font-size: 15px; font-weight: 700; }
  .hist-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .hist-player-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: clamp(13px, 1vw, 17px); }

  /* ── Stat modal player ── */
  .stat-player { margin-bottom: 14px; padding: 12px 14px; background: var(--bg3); border-radius: 10px; border: 1px solid var(--border2); }
  .stat-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat-fields label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; text-transform: capitalize; }
  .stat-fields input { width: 100%; padding: 6px 8px; font-size: 13px; }

  /* ── Add form ── */
  #add-form { display: flex; gap: clamp(8px, 0.8vw, 14px); align-items: center; flex-wrap: wrap; }
  #add-form input[type=text] { flex: 2; min-width: 140px; font-size: clamp(13px, 0.9vw, 16px); }
  #add-form select { flex: 1; min-width: 130px; }
  .add-rating-wrap { flex: 2; min-width: 180px; }
  .add-rating-wrap span { font-size: clamp(15px, 1.2vw, 20px); color: var(--text); font-weight: 700; display: block; margin-bottom: 6px; }
  #add-form input[type=range] { width: 100%; }

  /* ── Search ── */
  #search-row { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  #search-row input { flex: 1; }
  #search-count { color: var(--muted); font-size: 13px; white-space: nowrap; font-family: var(--mono); }

  /* ── Drag handle ── */
  .drag-handle { cursor: grab; color: var(--muted2); font-size: 16px; padding: 0 4px; }

  /* ── Empty state ── */
  .empty-state { text-align: center; color: var(--muted); padding-top: 60px; }
  .empty-state .empty-icon { font-size: 48px; display: block; margin-bottom: 16px; opacity: .5; }
  .empty-state p { font-size: 15px; margin-bottom: 6px; }
  .empty-state small { font-size: 13px; }

  /* ── Corner decoration ── */
  .corner-tl, .corner-br {
    position: absolute; width: 12px; height: 12px;
    pointer-events: none;
  }
  .corner-tl { top: 8px; left: 8px; border-top: 2px solid var(--border2); border-left: 2px solid var(--border2); }
  .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--border2); border-right: 2px solid var(--border2); }

  @keyframes mecha-pulse {
    0%,100%{box-shadow:0 0 12px #FFD70066,0 0 24px #FFD70033;border-color:#FFD700}
    50%{box-shadow:0 0 24px #FFD700aa,0 0 48px #FFD70055;border-color:#fff7a0}
  }
  @keyframes adr-pulse {
    0%, 100% { text-shadow: 0 0 8px #F6C343, 0 0 16px #F6C343aa; }
    50% { text-shadow: 0 0 16px #F6C343, 0 0 32px #F6C343, 0 0 48px #F6C34366; }
  }

  @media (max-width: 640px) {
    .teams-row { flex-direction: column; }
    #add-form { gap: 8px; }
    .hist-teams { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div class="logo">CS2</div>
    <div class="logo-sep">|</div>
    <div class="logo-title">PICKUP ORGANIZER</div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
      <div id="header-stats" style="font-size:13px;color:var(--muted);font-family:var(--mono);margin-right:8px">0 players · 0 matches</div>
      <button onclick="location.reload()" title="Refresh data"
        style="padding:7px 16px;background:transparent;border:1px solid var(--border2);border-radius:8px;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;transition:color .15s,border-color .15s"
        onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--text)'"
        onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border2)'">🔄</button>
      <div id="readonly-badge" style="display:none;padding:6px 14px;background:#1a2533;border:1px solid #2a3a4a;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:1px;color:#64748b">👁 VIEW ONLY</div>
      <button id="admin-btn" onclick="promptAdmin()"
        style="padding:6px 14px;background:transparent;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--muted);cursor:pointer;font-family:var(--font);transition:color .15s,border-color .15s"
        onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--text)'"
        onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border2)'">🔒 Login</button>
    </div>
  </div>

  <div id="nav">
    <button class="nav-btn active" data-view="roster">ROSTER</button>
    <button class="nav-btn" data-view="lobby">LOBBY <span id="nav-lobby-count">(0/10)</span></button>
    <button class="nav-btn" data-view="match">MATCH</button>
    <button class="nav-btn" data-view="history">HISTORY</button>
    <button class="nav-btn" data-view="leaderboard">LEADERBOARD</button>
    <button class="nav-btn" data-view="rankings">RANK SUGGESTIONS</button>
    <button class="nav-btn" id="admin-tab" data-view="admin" style="display:none">⚙ ADMIN</button>
  </div>

  <div id="content"></div>
</div>

<div id="flash"></div>

<script>
// ─── Data & state ──────────────────────────────────────────────────────────
const MAPS = ["Dust2","Mirage","Inferno","Nuke","Overpass","Ancient","Anubis","Vertigo","Cache"];
const ROLES = ["Entry Fragger","AWPer","Support","IGL","Lurker","Flex"];

// ─── Admin auth ───────────────────────────────────────────────────────────
const ADMIN_HASH   = "6b459776b8d6c34a17ff055736199da50101a9a2612e39b3b368c03fe60a7978";
const TRUSTED_HASH = "6e555e9ce62713c861e76c62096ae084e83827043890932ed4abae582e6b54e7";
// Trust levels: 0 = viewer, 1 = trusted (add players/matches), 2 = admin (full access)
let TRUST_LEVEL = 0;
let READONLY = true; // true when TRUST_LEVEL === 0

async function hashString(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function checkAdminSession() {
  const level = parseInt(sessionStorage.getItem("cs2_trust_level") || "0");
  TRUST_LEVEL = level;
  READONLY = level === 0;
}

function currentUser() {
  return sessionStorage.getItem("cs2_user_name") || "unknown";
}

async function promptAdmin() {
  // Custom modal with hidden password input instead of native prompt
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.style.zIndex = "99999";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(340px,95vw)">
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px">🔒 Login</div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Your name</label>
      <input id="admin-name-input" type="text" placeholder="e.g. penguin" autocomplete="name"
        style="width:100%;margin-bottom:10px;font-size:15px" />
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Password</label>
      <input id="admin-pw-input" type="password" placeholder="Password" autocomplete="current-password"
        style="width:100%;margin-bottom:8px;font-size:15px" />
      <div id="admin-pw-error" style="font-size:12px;color:#fc8181;min-height:16px;margin-bottom:12px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="admin-pw-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2" id="admin-pw-submit">UNLOCK</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const nameInput = document.getElementById("admin-name-input");
  const input = document.getElementById("admin-pw-input");
  const error = document.getElementById("admin-pw-error");
  nameInput.focus();

  const attempt = async () => {
    const name = nameInput.value.trim();
    const pw   = input.value;
    if (!name) { error.textContent = "Please enter your name."; nameInput.focus(); return; }
    if (!pw)   { error.textContent = "Please enter the password."; input.focus(); return; }
    const hash = await hashString(pw);
    if (hash === ADMIN_HASH) {
      TRUST_LEVEL = 2;
      sessionStorage.setItem("cs2_trust_level", "2");
      sessionStorage.setItem("cs2_user_name", name);
      READONLY = false;
      overlay.remove();
      render();
      updateAdminBadge();
      flash(`Admin mode unlocked — logged in as ${name}`);
    } else if (hash === TRUSTED_HASH) {
      TRUST_LEVEL = 1;
      sessionStorage.setItem("cs2_trust_level", "1");
      sessionStorage.setItem("cs2_user_name", name);
      READONLY = false;
      overlay.remove();
      render();
      updateAdminBadge();
      flash(`Trusted mode unlocked — logged in as ${name}`);
    } else {
      error.textContent = "Incorrect password.";
      input.value = "";
      input.focus();
    }
  };

  document.getElementById("admin-pw-cancel").addEventListener("click", () => overlay.remove());
  document.getElementById("admin-pw-submit").addEventListener("click", attempt);
  input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
  nameInput.addEventListener("keydown", e => { if (e.key === "Enter") input.focus(); });
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
}

function updateAdminBadge() {
  const badge = document.getElementById("readonly-badge");
  const adminBtn = document.getElementById("admin-btn");
  const adminTab = document.getElementById("admin-tab");
  if (!badge || !adminBtn) return;
  if (TRUST_LEVEL === 0) {
    badge.style.display = "block";
    badge.textContent = "👁 VIEW ONLY";
    badge.style.color = "#64748b";
    adminBtn.textContent = "🔒 Login";
    document.querySelectorAll(".nav-btn[data-view='match']").forEach(b => b.style.display = "none");
    if (adminTab) adminTab.style.display = "none";
  } else if (TRUST_LEVEL === 1) {
    badge.style.display = "block";
    badge.textContent = "✓ TRUSTED";
    badge.style.color = "#4299E1";
    adminBtn.textContent = "✓ Trusted";
    document.querySelectorAll(".nav-btn[data-view='match']").forEach(b => b.style.display = "none");
    if (adminTab) adminTab.style.display = "none";
  } else {
    badge.style.display = "block";
    badge.textContent = "🔓 ADMIN";
    badge.style.color = "#68D391";
    adminBtn.textContent = "🔓 Admin";
    document.querySelectorAll(".nav-btn[data-view='match']").forEach(b => b.style.display = "");
    if (adminTab) adminTab.style.display = "";
  }
}
const RANK_LABELS = {
  1:"Silver 1",2:"Silver 2",3:"Silver 3",4:"Silver 4",5:"Silver Elite",6:"Silver Elite Master",
  7:"Gold Nova 1",8:"Gold Nova 2",9:"Gold Nova 3",10:"Gold Nova Master",
  11:"Master Guardian 1",12:"Master Guardian 2",13:"Master Guardian Elite",14:"Distinguished Master Guardian",
  15:"Legendary Eagle",16:"Legendary Eagle Master",17:"Supreme Master First Class",18:"Global Elite"
};
// Rank color gradient: grey -> light blue -> blue -> light purple -> purple -> pink -> red -> gold
const RANK_COLOR_STOPS = [
  [1,  "#C0C8D0"], // grey-white
  [3,  "#A8B8C8"], // light grey
  [5,  "#8AAEC8"], // grey-blue
  [7,  "#6EB4E8"], // light blue
  [9,  "#4299E1"], // blue
  [11, "#818CF8"], // light purple
  [13, "#A855F7"], // purple
  [15, "#D946A8"], // purple-pink
  [16, "#F43F5E"], // pink-red
  [17, "#E53E3E"], // red
  [18, "#F6C343"], // gold
];
function rankColor(r) {
  const v = Math.max(1, Math.min(18, r));
  for (let i = 0; i < RANK_COLOR_STOPS.length - 1; i++) {
    const [r0, c0] = RANK_COLOR_STOPS[i];
    const [r1, c1] = RANK_COLOR_STOPS[i + 1];
    if (v >= r0 && v <= r1) {
      const t = (v - r0) / (r1 - r0);
      const hex = h => parseInt(h, 16);
      const lerp = (a, b) => Math.round(a + (b - a) * t).toString(16).padStart(2, "0");
      const h0 = [c0.slice(1,3), c0.slice(3,5), c0.slice(5,7)];
      const h1 = [c1.slice(1,3), c1.slice(3,5), c1.slice(5,7)];
      return "#" + lerp(hex(h0[0]), hex(h1[0])) + lerp(hex(h0[1]), hex(h1[1])) + lerp(hex(h0[2]), hex(h1[2]));
    }
  }
  return RANK_COLOR_STOPS[RANK_COLOR_STOPS.length - 1][1];
}
const rankLabel = r => RANK_LABELS[Math.round(r)] || "Unranked";
const genId = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function calcElo(playerRating, oppAvg, won, kd) {
  const K = 32;
  const exp = 1 / (1 + Math.pow(10, (oppAvg - playerRating) / 400 * 18));
  const outcome = won ? 1 : 0;
  const perfBonus = (kd - 1) * 0.2;
  return K * (outcome - exp) + perfBonus * K * 0.3;
}

// Separate ELO calculation on a 1000-baseline scale
function calcEloPoints(playerElo, oppAvgElo, won, kd) {
  const K = 25;
  const exp = 1 / (1 + Math.pow(10, (oppAvgElo - playerElo) / 400));
  const outcome = won ? 1 : 0;
  const perfBonus = (kd - 1) * 0.15;
  return Math.round(K * (outcome - exp) + perfBonus * K * 0.4);
}

// ─── Hidden TrueSkill-style rating ────────────────────────────────────────
// μ (mu): estimated skill, seeded from manual rating scaled to 0-1800
// σ (sigma): uncertainty, starts at 300, shrinks toward 50 over ~20 games
const TS_MU_SCALE   = 100;   // manual rating 1-18 → mu 100-1800
const TS_SIGMA_INIT = 300;
const TS_SIGMA_MIN  = 50;
const TS_BETA       = 150;   // performance variability constant

function tsInit(p) {
  // Seed mu from manual rating, sigma from games played
  const mu    = p.mu    ?? (p.rating * TS_MU_SCALE);
  const games = (p.matchHistory||[]).length;
  const sigma = p.sigma ?? Math.max(TS_SIGMA_MIN, TS_SIGMA_INIT - games * 12);
  return { mu, sigma };
}

function tsUpdate(mu, sigma, oppMu, oppSigma, won, kd) {
  // Simplified Bayesian update: move mu toward performance signal
  // Performance signal: blend of win/loss and K/D relative to 1.0
  const c2    = 2 * TS_BETA * TS_BETA + sigma * sigma + oppSigma * oppSigma;
  const c     = Math.sqrt(c2);
  const delta = mu - oppMu;
  // Normal PDF/CDF approximations
  const x     = delta / c;
  const pdf   = Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
  const cdf   = 0.5 * (1 + Math.tanh(x * 0.7978845608)); // erf approx
  const outcome = won ? 1 : 0;
  const v     = won ? pdf / cdf : -pdf / (1 - cdf);
  const w     = v * (v + delta / c);
  const kdBonus = (kd - 1) * 15; // K/D contribution to mu shift
  const newMu    = mu + (sigma * sigma / c) * v + kdBonus * (sigma / TS_SIGMA_INIT);
  const newSigma = Math.max(TS_SIGMA_MIN, sigma * Math.sqrt(Math.max(0, 1 - (sigma * sigma / c2) * w)));
  return { mu: Math.max(50, Math.min(1850, newMu)), sigma: newSigma };
}

function tsConfidence(sigma) {
  // 0-100: how confident we are in this player's hidden rating
  return Math.round(100 * (1 - (sigma - TS_SIGMA_MIN) / (TS_SIGMA_INIT - TS_SIGMA_MIN)));
}

function tsToRank(mu) {
  // Convert hidden mu back to 1-18 rank scale for display
  return Math.max(1, Math.min(18, mu / TS_MU_SCALE));
}

// ─── API config (proxied via Cloudflare Worker — key never exposed) ─────────
const JSONBIN_URL = "https://cs2-pickup-api.penguinfrags.workers.dev";
let   saveTimeout = null;

async function loadData() {
  // 1. Load from localStorage instantly so the app is usable immediately
  try {
    const p = localStorage.getItem("cs2_players");
    const m = localStorage.getItem("cs2_matches");
    state.players = p ? JSON.parse(p) : JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
    state.matches  = m ? JSON.parse(m) : [];
  } catch {
    state.players = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));
    state.matches = [];
  }

  // 2. Show a small syncing badge in the header while fetching remote
  const showSync = (msg, color="var(--muted)") => {
    let el = document.getElementById("sync-badge");
    if (!el) {
      el = document.createElement("div");
      el.id = "sync-badge";
      el.style.cssText = "font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);transition:opacity .3s";
      document.getElementById("header-stats")?.after(el);
    }
    el.textContent = msg;
    el.style.color = color;
    el.style.opacity = "1";
  };

  const showSpinner = () => {
    if (document.getElementById("sync-spinner")) return;
    const el = document.createElement("div");
    el.id = "sync-spinner";
    el.style.cssText = "position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,8,15,0.6);z-index:8000;pointer-events:none";
    el.innerHTML = `
      <div style="width:44px;height:44px;border:3px solid var(--border2);border-top-color:#e53e3e;border-radius:50%;animation:spin .7s linear infinite"></div>
      <div style="font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted)">SYNCING…</div>`;
    if (!document.getElementById("spin-style")) {
      const style = document.createElement("style");
      style.id = "spin-style";
      style.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
      document.head.appendChild(style);
    }
    document.body.appendChild(el);
  };

  const hideSpinner = () => {
    const el = document.getElementById("sync-spinner");
    if (el) { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(()=>el.remove(), 350); }
  };

  const hideSync = () => {
    const el = document.getElementById("sync-badge");
    if (el) { el.style.opacity = "0"; setTimeout(()=>el.remove(), 400); }
  };

  showSync("⟳ SYNCING…");
  showSpinner();

  // 2. Fetch from JSONBin in the background
  const fetchWithTimeout = (ms) => Promise.race([
    fetch(JSONBIN_URL, { headers: {} }).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);

  try {
    let json;
    try {
      json = await fetchWithTimeout(20000);
    } catch(e) {
      // one retry after 2s
      await new Promise(r => setTimeout(r, 2000));
      json = await fetchWithTimeout(20000);
    }
    const data = json.record || json;
    if (data.players && data.players.length) {
      // Only overwrite local data if remote is newer
      // Track last save time in both local and remote
      const remoteTs  = data._savedAt || 0;
      const localTs   = parseInt(localStorage.getItem("cs2_savedAt") || "0");
      if (remoteTs >= localTs) {
        state.players     = data.players;
        state.matches     = data.matches     || [];
        state.activityLog = data.activityLog || [];
        localStorage.setItem("cs2_players", JSON.stringify(state.players));
        localStorage.setItem("cs2_matches", JSON.stringify(state.matches));
        localStorage.setItem("cs2_savedAt", String(remoteTs));
        render();
      } else {
        console.log("[Sync] Remote data is older than local — keeping local. Remote:", new Date(remoteTs).toISOString(), "Local:", new Date(localTs).toISOString());
        showSync("✓ LOCAL NEWER", "#68D391");
      }
    }
    showSync("✓ SYNCED", "#68D391");
    hideSpinner();
    setTimeout(hideSync, 2000);
  } catch (err) {
    if (err.message === "timeout") {
      hideSpinner();
      showSync("⚠ SLOW", "#ECC94B");
      setTimeout(hideSync, 3000);
    } else {
      console.error("JSONBin load error:", err);
      hideSpinner();
      showSync("⚠ CACHED", "#ECC94B");
      setTimeout(hideSync, 3000);
    }
  }
}

function saveData() {
  // Always cache locally as backup
  const savedAt = Date.now();
  localStorage.setItem("cs2_players", JSON.stringify(state.players));
  localStorage.setItem("cs2_matches", JSON.stringify(state.matches));
  localStorage.setItem("cs2_savedAt", String(savedAt));
  // Debounce remote saves — wait 800ms after last change before writing
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await fetch(JSONBIN_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ players: state.players, matches: state.matches, activityLog: state.activityLog, _savedAt: savedAt })
      });
    } catch (err) {
      console.error("JSONBin save error:", err);
      flash("Save failed — data cached locally");
    }
  }, 800);
}

      const vals = h.map(m=>m.leetifyRating).filter(v=>v!=null);
      const avg = vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      return { id: p.id, avg };
    })
    .filter(x => x.avg !== null)
    .sort((a,b) => b.avg - a.avg);

}

function getRankSuggestions() {
  const THRESHOLD = 35;
  const ELO_TO_RANK_SCALE = 17 / 400;

  return state.players
    .filter(p => (p.matchHistory||[]).length >= 3 && p.elo != null)
    .map(p => {
      const ts       = tsInit(p);
      const hidden   = tsToRank(ts.mu);
      const conf     = tsConfidence(ts.sigma);
      const drift    = (p.elo - 1000);
      if (Math.abs(drift) < THRESHOLD) return null;
      const change   = drift * ELO_TO_RANK_SCALE;
      const suggested = Math.max(1, Math.min(18, Math.round((p.rating + change) * 2) / 2));
      if (Math.abs(suggested - p.rating) < 0.5) return null;
      return {
        id: p.id, name: p.name,
        current: p.rating, suggested,
        hiddenRank: hidden, confidence: conf,
        eloDrift: drift, up: suggested > p.rating,
      };
    })
    .filter(Boolean)
    .sort((a,b) => Math.abs(b.eloDrift) - Math.abs(a.eloDrift));
}

function checkAddRateLimit() {
  if (TRUST_LEVEL >= 1) return true; // trusted and admins unlimited
  const LIMIT = 5;
  const WINDOW = 60 * 60 * 1000; // 1 hour
  const now = Date.now();
  const raw = localStorage.getItem("cs2_add_log");
  const log = raw ? JSON.parse(raw).filter(t => now - t < WINDOW) : [];
  if (log.length >= LIMIT) {
    const oldest = log[0];
    const minsLeft = Math.ceil((WINDOW - (now - oldest)) / 60000);
    flash(`Player limit reached — try again in ${minsLeft} min`);
    return false;
  }
  log.push(now);
  localStorage.setItem("cs2_add_log", JSON.stringify(log));
  return true;
}

function addPlayer() {
  const name = document.getElementById("new-name").value.trim();
  if (!name) { flash("Enter a player name"); return; }
  if (!checkAddRateLimit()) return;
  const steamId = document.getElementById("new-steamid")?.value.trim() || "";
  const p = {
    id: genId(), name,
    rating: state.addForm.rating,
    matchHistory: [],
    aliases: steamId ? [steamId] : [],
    ...(steamId ? { steam64Id: steamId } : {})
  };
  state.players.push(p);
  state.addForm.name = "";
  document.getElementById("new-steamid").value = "";
  // Log the addition and initial rating server-side
  logInitialRating(p);
  state.activityLog.push({ type:"add_player", name: p.name, rating: p.rating, by: currentUser(), at: Date.now() });
  saveData(); render();
  flash(`${p.name} added to roster${steamId ? " · Leetify linked" : ""}`);
}

function logRatingChange(pid, oldRating, newRating, source) {
  const p = state.players.find(x=>x.id===pid);
  if (!p) return;
  const by = currentUser();
  if (!p.ratingHistory) p.ratingHistory = [];
  p.ratingHistory.push({ from: oldRating, to: newRating, at: Date.now(), source, by });
  state.activityLog.push({ type:"rating_change", name: p.name, from: oldRating, to: newRating, source, by, at: Date.now() });
}

function logInitialRating(p) {
  const by = currentUser();
  p.ratingHistory = [{ from: null, to: p.rating, at: Date.now(), source: "initial", by }];
  state.activityLog.push({ type:"rating_initial", name: p.name, rating: p.rating, by, at: Date.now() });
}

function buildBalancedTeams() {
  // Sort by rating but shuffle players within 1.0 rating of each other
  // This prevents the same teams forming every time with the same lobby
  const players = state.lobby.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
  
  // Shuffle within tiers: group players within 1.0 rating of each other, shuffle each group
  const sorted = [...players].sort((a,b) => b.rating - a.rating);
  const tiered = [];
  let i = 0;
  while (i < sorted.length) {
    let j = i + 1;
    while (j < sorted.length && sorted[i].rating - sorted[j].rating < 1.0) j++;
    const group = sorted.slice(i, j);
    // Fisher-Yates shuffle within tier
    for (let k = group.length - 1; k > 0; k--) {
      const r = Math.floor(Math.random() * (k + 1));
      [group[k], group[r]] = [group[r], group[k]];
    }
    tiered.push(...group);
    i = j;
  }
  
  // Snake draft from shuffled-tier pool — randomly pick which team gets first pick
  const ct=[], t=[];
  const flip = Math.random() < 0.5; // randomize which team gets pick 1
  tiered.forEach((p,i) => {
    const block = Math.floor(i/2);
    const pos   = i%2;
    const onCt  = block%2===0 ? pos===0 : pos===1;
    (flip ? onCt : !onCt) ? ct.push(p) : t.push(p);
  });
  return { ct, t };
}

function balanceTeams() {
  if (state.lobby.length !== 10) return;
  state.teams = buildBalancedTeams();
  state.currentMatch = null;
  state.pendingStats = {};
  setView("match");
  flash("Teams balanced — select a map to start");
}

// ─── CAPTAIN'S DRAFT ─────────────────────────────────────────────────────
function startDraft() {
  if (state.lobby.length !== 10) return;
  const allIds = state.lobby.slice();
  state.draft = {
    phase: "captains",  // "captains" | "picks"
    captains: { ct: null, t: null },
    pool: allIds,       // all 10 start in pool; captains are removed when selected
    picks: { ct: [], t: [] },
    turn: "ct",         // overwritten by coin flip when both captains are set
    firstPick: null,    // announced after coin flip
  };
  state.teams = null;
  state.currentMatch = null;
  state.pendingStats = {};
  setView("match");
}

      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:28px;height:32px;flex-shrink:0">${rankBadgeSVG(p.rating,rankColor(p.rating))}</div>

  };

  const poolCards = pool.map(p=>`
    <div class="card clickable" data-draft-pick="${esc(p.id)}" style="padding:12px 14px;display:flex;align-items:center;gap:10px;transition:border-color .15s;"

      <div style="flex-shrink:0;width:32px;height:36px">${rankBadgeSVG(p.rating, rankColor(p.rating))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(p.name)}</div>
        <div style="font-size:11px;color:${rankColor(p.rating)};font-weight:600">${esc(rankLabel(p.rating))}</div>
      </div>
      <div style="font-size:11px;font-weight:700;color:${turnColor}">PICK →</div>
    </div>`).join('');

  const isFirstPick = (ctPicks.length + tPicks.length) === 2; // only captains so far
  const coinBanner = isFirstPick ? `
    <div style="background:${turnColor}18;border:1px solid ${turnColor}44;border-radius:10px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
      <span style="font-size:20px">🪙</span>
      <div>
        <div style="font-size:13px;font-weight:700;color:${turnColor}">Coin flip — ${esc(turnCap.name)} picks first!</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${d.firstPick==='ct'?capCT.name+"'s team":capT.name+"'s team"} won the toss</div>
      </div>
    </div>` : '';

  return `
  <div style="margin-bottom:16px">
    <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">CAPTAIN'S DRAFT</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:8px;height:8px;border-radius:50%;background:${turnColor}"></div>
      <span style="color:${turnColor};font-weight:700;font-size:14px">${esc(turnCap.name)}</span>
      <span style="color:var(--muted);font-size:13px">is picking · ${picksLeft} picks remaining</span>
    </div>
  </div>
  ${coinBanner}

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
    <div style="background:var(--bg2);border:1px solid rgba(66,153,225,${d.turn==='ct'?'.5':'.2'});border-radius:14px;padding:16px;transition:border-color .2s">
      <div style="color:var(--blue);font-weight:800;font-size:16px;letter-spacing:3px;margin-bottom:12px">

      </div>
      ${ctPicks.map(p=>pickRow(p,'ct')).join('')}
    </div>
    <div style="background:var(--bg2);border:1px solid rgba(229,62,62,${d.turn==='t'?'.5':'.2'});border-radius:14px;padding:16px;transition:border-color .2s">
      <div style="color:var(--red);font-weight:800;font-size:16px;letter-spacing:3px;margin-bottom:12px">
        ${capT ? capT.name+"'s team" : 'Team 2'} ${d.turn==='t'?'▶ PICKING':''}
      </div>
      ${tPicks.map(p=>pickRow(p,'t')).join('')}

  </div>

  ${pool.length > 0 ? `
  <div class="card">
    <div class="sec-label" style="margin-bottom:12px">AVAILABLE — ${pool.length} LEFT</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
      ${poolCards}
    </div>
  </div>` : ''}`;
}

function bindDraft() {
  // Phase 1: set captains
  document.querySelectorAll("[data-set-captain]").forEach(el => {
    el.addEventListener("click", () => {
      const pid = el.dataset.setCaptain;
      const d = state.draft;
      if (!d.captains.ct) {
        d.captains.ct = pid;
        d.picks.ct = [pid];
        d.pool = d.pool.filter(id=>id!==pid);
        // if T captain already chosen, randomize first pick and go to picks
        if (d.captains.t) {
          d.turn = Math.random() < 0.5 ? "ct" : "t";
          d.firstPick = d.turn;
          d.phase = "picks";
        }
      } else if (!d.captains.t) {
        d.captains.t = pid;
        d.picks.t = [pid];
        d.pool = d.pool.filter(id=>id!==pid);
        d.turn = Math.random() < 0.5 ? "ct" : "t";
        d.firstPick = d.turn;
        d.phase = "picks";
      }
      render();
    });
  });

  // Phase 2: picks
  document.querySelectorAll("[data-draft-pick]").forEach(el => {
    el.addEventListener("click", () => {
      const pid = el.dataset.draftPick;
      const d = state.draft;
      d.picks[d.turn].push(pid);
      d.pool = d.pool.filter(id=>id!==pid);
      if (d.pool.length === 0) {
        const getPlayers = ids => ids.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
        state.teams = { ct: getPlayers(d.picks.ct), t: getPlayers(d.picks.t) };
        state.draft = null;
        render();
        flash("Draft complete — select a map to start");
      } else {
        d.turn = d.turn==="ct" ? "t" : "ct";
        render();
      }
    });
  });
}

// ─── MATCH ────────────────────────────────────────────────────────────────
// Returns "PlayerName's team" using highest-rated player, or fallback
function teamLabel(players, fallback) {
  if (!players || !players.length) return fallback;
  const top = [...players].sort((a,b)=>b.rating-a.rating)[0];
  return top ? `${top.name}'s team` : fallback;
}

function teamColHTML(team, label, side, showStatBtn, statsEntered) {
  const avg = (team.reduce((s,p)=>s+p.rating,0)/team.length).toFixed(1);
  const color = side==="ct" ? "var(--blue)" : "var(--red)";
  const rows  = team.map(p=>`
    <div class="team-player-row">
      <div>
        <div class="tpr-name">${esc(p.name)}</div>
      </div>
      <div class="tpr-rank" style="color:${rankColor(p.rating)}">${esc(rankLabel(Math.round(p.rating)))}</div>
    </div>`).join('');

  const statBtn = showStatBtn ? `
    <button class="btn" style="width:100%;margin-top:12px;
      background:${statsEntered?'#1e4020':'var(--bg3)'};
      border:1px solid ${statsEntered?'#2a5a2a':color+'55'};
      color:${statsEntered?'#68D391':color};"
      data-stat-modal="${side}">
      ${statsEntered ? '✓ Stats Entered' : 'Enter Player Stats'}
    </button>` : '';

  return `
  <div class="team-col ${side}">
    <div class="team-header">
      <span class="team-label" style="color:${color}">${label}</span>
      <span class="team-avg">avg ${avg} · ${esc(rankLabel(Math.round(parseFloat(avg))))}</span>
    </div>
    ${rows}
    ${statBtn}
  </div>`;
}

function renderMatch() {
  if (state.draft) return renderDraft();
  if (!state.teams) return `
    <div class="empty-state">
      <span class="empty-icon">⚔</span>
      <p>No teams built yet</p>
      <small>Go to Lobby, add 10 players, then Auto Balance or Captain's Draft</small><br><br>
      <button class="btn btn-primary" onclick="setView('lobby')" style="margin-top:12px">GO TO LOBBY</button>
    </div>`;

  const { ct, t } = state.currentMatch || state.teams;
  const inMatch = !!state.currentMatch;
  const bothStats = state.pendingStats.ct && state.pendingStats.t;

  const mapPicker = !inMatch ? `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="sec-label" style="margin:0">SELECT MAP</div>
        <button class="btn btn-ghost" id="random-map-btn" style="gap:6px;font-size:12px;padding:6px 12px">🎲 RANDOM</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${MAPS.map(m=>`<button class="map-btn" data-start-map="${esc(m)}">${esc(m.toUpperCase())}</button>`).join('')}
      </div>
    </div>` : '';

  const winPanel = inMatch && bothStats ? `
    <div class="card" style="margin-top:20px">
      <div class="sec-label" style="margin-bottom:14px">RECORD RESULT — WHO WON?</div>
      <div style="display:flex;gap:12px">
        <button class="win-btn ct" data-winner="ct">${teamLabel(state.currentMatch.ct,"Team 1").toUpperCase()} WIN</button>
        <button class="win-btn t"  data-winner="t">${teamLabel(state.currentMatch.t,"Team 2").toUpperCase()} WIN</button>
      </div>
    </div>` : '';

  const waitMsg = inMatch && !bothStats ? `
    <p style="color:var(--muted);font-size:13px;text-align:center;margin-top:16px">
      Enter stats for both teams above to unlock the result panel
    </p>` : '';

  const matchHeader = inMatch ? `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--text)">MATCH IN PROGRESS</div>
        <div style="color:var(--red);font-size:14px;font-weight:600;margin-top:2px">MAP: ${esc(state.currentMatch.map.toUpperCase())}</div>
      </div>
      ${TRUST_LEVEL >= 1 ? `<button class="btn btn-ghost" id="leetify-import-btn" style="border-color:#f84982;color:#f84982;gap:8px;align-self:flex-start">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#f84982" style="flex-shrink:0"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        IMPORT FROM LEETIFY
      </button>` : ''}
    </div>` : `
    <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">TEAMS BALANCED</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:20px">Select a map to start the match</div>`;

  const label1 = teamLabel(ct,"Team 1");
  const label2 = teamLabel(t, "Team 2");

  return `
  ${matchHeader}
  <div class="teams-row" style="margin-bottom:20px">
    ${teamColHTML(ct, label1, "ct", inMatch, !!state.pendingStats.ct)}
    ${teamColHTML(t,  label2, "t",  inMatch, !!state.pendingStats.t)}
  </div>
  <div style="display:flex;gap:10px;margin-bottom:20px">
    ${!inMatch ? `<button class="btn btn-ghost" id="reroll-btn" style="gap:6px">🎲 REROLL TEAMS</button>` : ''}
    <button class="btn btn-ghost" id="copy-teams-btn" style="gap:8px">📋 COPY TEAMS FOR DISCORD</button>

function bindMatch() {
  if (state.draft) { bindDraft(); return; }
  document.querySelectorAll("[data-start-map]").forEach(btn => {
    btn.addEventListener("click", () => {
      const map = btn.dataset.startMap;
      state.currentMatch = { id:genId(), map, ct:state.teams.ct, t:state.teams.t, startedAt:Date.now() };
      state.pendingStats = {};
      render();
    });
  });
  document.querySelectorAll("[data-stat-modal]").forEach(btn => {
    btn.addEventListener("click", () => openStatModal(btn.dataset.statModal));
  });
  document.querySelectorAll("[data-winner]").forEach(btn => {
    btn.addEventListener("click", () => finalizeMatch(btn.dataset.winner));
  });
  document.getElementById("leetify-import-btn")?.addEventListener("click", openLeetifyImport);

  document.getElementById("random-map-btn")?.addEventListener("click", () => {
    const map = MAPS[Math.floor(Math.random() * MAPS.length)];
    flash(`🎲 Random map: ${map}`);
    // Highlight the selected map button
    document.querySelectorAll(".map-btn").forEach(b => {
      b.style.borderColor = b.dataset.startMap === map ? "var(--red)" : "";
      b.style.color = b.dataset.startMap === map ? "var(--red)" : "";
    });
  });
  document.getElementById("reroll-btn")?.addEventListener("click", () => {
    if (state.lobby.length !== 10) { flash("Need 10 players in lobby to reroll"); return; }
    const prevCt = new Set((state.teams?.ct||[]).map(p=>p.id));
    let newTeams, attempts = 0;
    do {
      newTeams = buildBalancedTeams();
      attempts++;
      // Check if teams are different (at least 2 players swapped)
      const newCtIds = new Set(newTeams.ct.map(p=>p.id));
      const swapped = [...newCtIds].filter(id=>!prevCt.has(id)).length;
      if (swapped >= 1 || attempts >= 10) break;
    } while (true);
    state.teams = newTeams;
    render();
    flash("Teams rerolled!");
  });

  document.getElementById("copy-teams-btn")?.addEventListener("click", () => {
    const { ct, t } = state.currentMatch || state.teams;
    const label1 = teamLabel(ct, "Team 1");
    const label2 = teamLabel(t,  "Team 2");
    const avg = arr => (arr.reduce((s,p)=>s+p.rating,0)/arr.length).toFixed(1);
    const mapLine = state.currentMatch ? `Map: ${state.currentMatch.map}\n\n` : '';
    const formatTeam = (players, label) => {
      const lines = players
        .slice().sort((a,b)=>b.rating-a.rating)
        .map(p => `  • ${p.name} (${p.rating.toFixed(1)})`).join('\n');
      return `${label} [avg ${avg(players)}]\n${lines}`;
    };
    const text = `🎲 10-Man Teams\n\n${mapLine}${formatTeam(ct, label1)}\n\n${formatTeam(t, label2)}`;
    navigator.clipboard.writeText(text).then(() => flash("Teams copied to clipboard!")).catch(() => {
      // fallback for browsers that block clipboard
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      flash("Teams copied to clipboard!");
    });
  });
}

// ─── Leetify import ──────────────────────────────────────────────────────
function openLeetifyImport() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "leetify-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(520px,95vw)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <h3 style="color:var(--text);font-size:16px;">Import from Leetify</h3>
      </div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6">
        Paste the Leetify match URL below. Stats will be fetched and matched to your roster players by name — you can adjust any mappings before confirming.
      </p>
      <input id="leetify-url" type="text" placeholder="https://leetify.com/app/match-details/xxxxxxxx-.../overview"
        style="width:100%;margin-bottom:12px" />
      <div id="leetify-status" style="font-size:12px;color:var(--muted);min-height:18px;margin-bottom:10px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="leetify-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2;background:#f84982;border:none" id="leetify-fetch">FETCH STATS</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const setStatus = (msg, color="#5a7080") => {
    const el = document.getElementById("leetify-status");
    if (el) { el.textContent = msg; el.style.color = color; }
  };

  document.getElementById("leetify-cancel").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });

  document.getElementById("leetify-fetch").addEventListener("click", async () => {
    const url = document.getElementById("leetify-url").value.trim();
    // extract UUID from URL
    const match = url.match(/match-details\/([0-9a-f-]{36})/i);
    if (!match) { setStatus("Could not find a match ID in that URL. Paste the full Leetify match URL.", "#e53e3e"); return; }
    const gameId = match[1];
    setStatus("Fetching match data from Leetify…");
    document.getElementById("leetify-fetch").disabled = true;

    try {
      const res = await fetch(`https://api.cs-prod.leetify.com/api/games/${gameId}`);
      if (!res.ok) throw new Error(`API returned ${res.status}`);
      const data = await res.json();
      overlay.remove();
      openLeetifyMapping(data);
    } catch(err) {
      setStatus(`Failed to fetch: ${err.message}. Make sure the match is public on Leetify.`, "#e53e3e");
      document.getElementById("leetify-fetch").disabled = false;
    }
  });
}

function openLeetifyMapping(data) {
  // Flatten all player stats from the Leetify response
  // The public API returns data.playerStats[] or data.stats[] depending on version
  // Log the raw response so field names can be inspected if mapping breaks
  console.log("[Leetify import] raw response:", JSON.stringify(data).slice(0, 2000));
  const rawStats = data.playerStats || data.stats || data.players || [];
  if (!rawStats.length) {
    flash("No player stats found in Leetify response — check console for raw data");
    console.log("[Leetify import] full response:", data);
    return;
  }

  const allRosterPlayers = [
    ...(state.currentMatch.ct || []),
    ...(state.currentMatch.t  || [])
  ];

  // Build simple name similarity scorer
  const similarity = (a, b) => {
    a = a.toLowerCase().replace(/[^a-z0-9]/g, "");
    b = b.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (a === b) return 1;
    if (a.includes(b) || b.includes(a)) return 0.8;
    let matches = 0;
    for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) matches++;
    return matches / Math.max(a.length, b.length);
  };

  // Auto-suggest best match for each Leetify player
  const leetifyPlayers = rawStats.map(s => {
    const name    = s.name || s.player_name || s.steam_name || s.steamName || s.nickname || "Unknown";
    const kills   = s.totalKills   ?? s.total_kills   ?? s.kills   ?? 0;
    const deaths  = s.totalDeaths  ?? s.total_deaths  ?? s.deaths  ?? 0;
    const assists = s.totalAssists ?? s.total_assists ?? s.assists ?? 0;
    const damage  = s.totalDamage  ?? s.total_damage  ?? s.damage  ?? 0;
    const leetifyRating = s.leetifyRating ?? s.leetify_rating ?? null;
    const hltvRating    = s.hltvRating    ?? s.hltv_rating    ?? null;
    const reactionTime    = s.reactionTime    ?? null;
    const kast            = s.kast            ?? null;
    const counterRatio    = s.counterStrafingShotsGoodRatio ?? null;
    const counterAll      = s.counterStrafingShotsAll ?? 0;
    const wastedAmmo      = s.totalWastedMagazineAmmo ?? 0;
    const reloads         = s.totalReloads    ?? 0;
    const flashFriend     = s.flashbangHitFriend ?? 0;
    const flashFoe        = s.flashbangHitFoe ?? 0;
    const roundsSurvived  = s.roundsSurvived  ?? 0;
    const multi3k         = s.multi3k         ?? 0;
    const multi2k         = s.multi2k         ?? 0;
    const multi4k         = s.multi4k         ?? 0;
    const multi5k         = s.multi5k         ?? 0;
    const tradeKillsSucceeded = s.tradeKillsSucceeded ?? 0;
    const accuracy        = s.accuracy        ?? null;
    const dpr             = s.dpr             ?? null;
    const mvps            = s.mvps            ?? 0;
    const hsp             = s.hsp             ?? null;
    const flashbangScore  = s.flashbangScore  ?? null;
    const utilityOnDeath  = s.utilityOnDeathAvg ?? null;
    const sprayAccuracy   = s.sprayAccuracy   ?? null;
    const heDmg           = s.heFoesDamageAvg ?? null;
    const molotovDmg      = s.molotovFoesDamageAvg ?? null;
    const utilityDmg      = (heDmg != null || molotovDmg != null) ? (heDmg??0) + (molotovDmg??0) : null;
    // initialTeamNumber: 3 = CT, 2 = T (Valve/CS2 convention)
    const teamNum = s.initialTeamNumber ?? s.teamNumber ?? s.team_number ?? null;
    const side    = teamNum === 2 ? "ct" : teamNum === 3 ? "t" : null;
    console.log("[Leetify import] player:", name, "K/D/A:", kills, deaths, assists, "dmg:", damage, "team:", teamNum, "->", side);
    // Match by steam64Id first (exact, reliable), then name/alias similarity
    const steam64 = s.steam64Id || s.steam_64_id || null;
    let bestId = "";
    if (steam64) {
      const exact = allRosterPlayers.find(p => p.steam64Id === steam64 || (p.aliases||[]).includes(steam64));
      if (exact) bestId = exact.id;
    }
    if (!bestId) {
      let bestScore = -1;
      allRosterPlayers.forEach(p => {
        const namesToCheck = [p.name, ...(p.aliases || [])];
        const score = Math.max(...namesToCheck.map(n => similarity(name, n)));
        if (score > bestScore) { bestScore = score; bestId = p.id; }
      });
    }
    return { name, steam64, kills, deaths, assists, damage, leetifyRating, hltvRating, reactionTime, kast, counterRatio, counterAll, wastedAmmo, reloads, flashFriend, flashFoe, roundsSurvived, multi2k, multi3k, multi4k, multi5k, tradeKillsSucceeded, accuracy, dpr, mvps, hsp, flashbangScore, utilityOnDeath, sprayAccuracy, utilityDmg, side, suggestedId: bestId };
  });

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(580px,95vw)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <h3 style="color:var(--text);font-size:16px;">Map Leetify Players to Roster</h3>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-bottom:16px">
        Match each Steam name from Leetify to your roster player. Best guesses are pre-filled — adjust where needed.
      </p>
      <div id="leetify-mappings">
        ${leetifyPlayers.map((lp, i) => `
        <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:10px;padding:10px 12px;background:var(--bg3);border-radius:9px;border:1px solid var(--border)">
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--text)">${esc(lp.name)}</div>
            <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">${lp.kills}/${lp.deaths}/${lp.assists}</div>
          </div>
          <div style="color:var(--muted);font-size:16px">→</div>
          <select data-lp-index="${i}" style="width:100%;font-size:13px">
            <option value="">— skip —</option>

      </div>

    selects.forEach(sel => {
      const idx = parseInt(sel.dataset.lpIndex);
      const pid = sel.value;
      if (!pid) return;
      const lp = leetifyPlayers[idx];
      // prefer Leetify's own team assignment; fall back to checking current match teams
      const inCT = state.currentMatch.ct.some(p=>p.id===pid);
      const side = lp.side || (inCT ? "ct" : "t");
      statsBySide[side][pid] = { kills: lp.kills, deaths: lp.deaths, assists: lp.assists, damage: lp.damage||0, leetifyRating: lp.leetifyRating??null, hltvRating: lp.hltvRating??null, reactionTime: lp.reactionTime, kast: lp.kast, counterRatio: lp.counterRatio, counterAll: lp.counterAll, wastedAmmo: lp.wastedAmmo, reloads: lp.reloads, flashFriend: lp.flashFriend, flashFoe: lp.flashFoe, roundsSurvived: lp.roundsSurvived, multi3k: lp.multi3k, accuracy: lp.accuracy, dpr: lp.dpr, mvps: lp.mvps };
    });

    // Ensure every player on each team has an entry — fill gaps with zeros
    // so pendingStats is always complete for both sides
    ["ct","t"].forEach(side => {
      const team = state.currentMatch[side];
      if (!state.pendingStats[side]) state.pendingStats[side] = {};
      team.forEach(p => {
        if (statsBySide[side][p.id]) {
          // imported stat — always overwrite
          state.pendingStats[side][p.id] = statsBySide[side][p.id];
        } else if (!state.pendingStats[side][p.id]) {
          // no existing manual stat either — fill with zeros as placeholder
          state.pendingStats[side][p.id] = { kills: 0, deaths: 0, assists: 0 };
        }
        // else: player already has a manually entered stat — leave it alone
      });
    });

    overlay.remove();
    render();
    const mapped = Object.values(statsBySide.ct).length + Object.values(statsBySide.t).length;
    flash(`Leetify stats applied for ${mapped} players — open each team to review`);
  });
}

// ─── Finalize match ────────────────────────────────────────────────────────
function finalizeMatch(winner) {
  if (!state.pendingStats.ct || !state.pendingStats.t) { flash("Enter stats for both teams first"); return; }
  const match = state.currentMatch;
  const allPlayers = [...match.ct, ...match.t];

  allPlayers.forEach(p => {
    const isCT   = match.ct.some(x=>x.id===p.id);
    const side   = isCT?"ct":"t";
    const won    = winner===side;
    const s      = state.pendingStats[side][p.id] || {kills:0,deaths:0,assists:0};
    const kd     = s.deaths>0 ? s.kills/s.deaths : s.kills;
    const opp    = isCT ? match.t : match.ct;
    const curElo = p.elo ?? 1000;
    const oppAvgElo = opp.reduce((a,x)=>a+(x.elo??1000),0)/opp.length;
    const eloDelta  = calcEloPoints(curElo, oppAvgElo, won, kd);
    const newElo    = Math.max(0, curElo + eloDelta);

    // TrueSkill hidden rating update
    const ts    = tsInit(p);
    const oppTs = { mu: opp.reduce((a,x)=>a+tsInit(x).mu,0)/opp.length,
                    sigma: opp.reduce((a,x)=>a+tsInit(x).sigma,0)/opp.length };
    const newTs = tsUpdate(ts.mu, ts.sigma, oppTs.mu, oppTs.sigma, won, kd);

    const idx = state.players.findIndex(x=>x.id===p.id);
    if(idx>-1) {
      state.players[idx].elo   = newElo;
      state.players[idx].mu    = newTs.mu;
      state.players[idx].sigma = newTs.sigma;
      // rating stays untouched
      state.players[idx].matchHistory = [
        ...(state.players[idx].matchHistory||[]),
        { matchId:match.id, won, kills:s.kills, deaths:s.deaths, assists:s.assists, damage:s.damage||0, leetifyRating:s.leetifyRating??null, hltvRating:s.hltvRating??null, reactionTime:s.reactionTime, kast:s.kast, counterRatio:s.counterRatio, counterAll:s.counterAll, wastedAmmo:s.wastedAmmo, reloads:s.reloads, flashFriend:s.flashFriend, flashFoe:s.flashFoe, roundsSurvived:s.roundsSurvived, multi2k:s.multi2k, multi3k:s.multi3k, multi4k:s.multi4k, multi5k:s.multi5k, tradeKillsSucceeded:s.tradeKillsSucceeded, accuracy:s.accuracy, dpr:s.dpr, mvps:s.mvps, hsp:s.hsp, flashbangScore:s.flashbangScore, utilityOnDeath:s.utilityOnDeath, sprayAccuracy:s.sprayAccuracy, utilityDmg:s.utilityDmg, eloDelta }
      ];
    }
  });

  const record = {
    id:match.id, map:match.map, winner, playedAt:Date.now(),
    teams:{ ct:match.ct.map(p=>p.id), t:match.t.map(p=>p.id) },
    scores:state.pendingStats
  };
  state.matches.unshift(record);
  state.teams = null; state.currentMatch = null; state.pendingStats = {}; state.lobby = [];
  saveData();
  const winningTeam = winner==="ct" ? match.ct : match.t;
  flash(`${teamLabel(winningTeam,"Team 1")} wins on ${match.map}`);
  setView("history");
}

          : `${delta>0?"+":""}${delta.toFixed(2)}`;
        const lrRaw = hist?.leetifyRating != null ? hist.leetifyRating * 100 : null;
        const lr = lrRaw != null ? `${lrRaw >= 0 ? "+" : ""}${lrRaw.toFixed(2)}` : null;
        const lrColor = lrRaw != null ? (lrRaw > 1 ? "#68D391" : lrRaw < -5 ? "#fc8181" : "var(--muted)") : "var(--muted)";
        const hltv = hist?.hltvRating != null ? hist.hltvRating.toFixed(2) : null;
        const hltvColor = hltv != null ? (hist.hltvRating >= 1.1 ? "#68D391" : hist.hltvRating < 0.9 ? "#fc8181" : "var(--muted)") : "var(--muted)";
        const rounds = m.roundScore ? (m.roundScore.ct + m.roundScore.t) : 0;
        const side = m.teams?.ct?.includes(p.id) ? "ct" : "t";
        const scoreEntry = m.scores?.[side]?.[p.id];
        const dmg = hist?.damage ?? scoreEntry?.damage ?? null;
        const adrNum = hist?.dpr != null ? hist.dpr : (scoreEntry?.dpr != null ? scoreEntry.dpr : (rounds > 0 && dmg != null ? dmg / rounds : null));
        const adr = adrNum !== null ? adrNum.toFixed(1) : null;
        const adrColor = adrNum === null ? "var(--muted)"
          : adrNum >= 150 ? "#F6C343"
          : adrNum >= 120 ? "#68D391"
          : adrNum >= 90  ? "#68D391"
          : adrNum >= 80  ? "#48BB78"
          : adrNum >= 70  ? "var(--text)"
          : adrNum >= 60  ? "#fc8181"
          : adrNum >= 35  ? "#E53E3E"
          : "#8B4513";
        const adrEffect = adrNum >= 150
          ? "text-shadow:0 0 8px #F6C343,0 0 16px #F6C343aa;animation:adr-pulse 1.5s ease-in-out infinite"
          : adrNum >= 120
          ? "text-shadow:0 0 6px #68D391aa"
          : "";
        return `
        <div style="display:grid;grid-template-columns:1fr auto auto auto auto auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:16px">
          <span style="color:var(--text);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;"
                data-player-profile="${esc(p.id)}">${esc(p.name)}</span>
          <span style="color:var(--muted);font-family:var(--mono)">${esc(kd)}</span>
          ${adr != null ? `<span style="color:${adrColor};font-family:var(--mono);font-size:14px;font-weight:${adrNum>=120?'800':'600'};${adrEffect}">ADR ${adr}</span>` : '<span></span>'}
          ${hltv != null ? `<span style="color:${hltvColor};font-family:var(--mono);font-size:14px">HLTV ${hltv}</span>` : '<span></span>'}
          ${lr != null ? `<span style="color:${lrColor};font-family:var(--mono);font-size:14px">LR ${lr}</span>` : '<span></span>'}
          <span style="color:${dColor};font-weight:600;font-family:var(--mono)">${deltaLabel}</span>
        </div>`;
      }).join('');
      return `
      <div>
        <div style="color:${color};font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:1px">
          ${label} ${won?"★ WIN":"LOSS"}
        </div>
        ${rows}
      </div>`;
    };

    const winTeam = m.winner==="ct" ? ctPs : tPs;
    const badgeStyle = m.winner==="ct"
      ? "background:#1a2a3a;color:#4299E1"
      : "background:#2a1a1a;color:#e53e3e";

    return `
    <div class="hist-card">
      <div class="hist-header">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:20px;font-weight:700;color:var(--text)">${esc(m.map)}</span>
          <span class="hist-badge" style="${badgeStyle}">${esc(teamLabel(winTeam,"Team 1"))} WIN</span>
          ${m.leetifyGameId ? `<a href="https://leetify.com/app/match-details/${esc(m.leetifyGameId)}/overview" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#f84982;text-decoration:none;letter-spacing:.5px;padding:3px 8px;border:1px solid #f8498244;border-radius:6px" title="View on Leetify"><svg width="10" height="10" viewBox="0 0 24 24" fill="#f84982"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>LEETIFY</a>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:var(--muted);font-size:14px;font-family:var(--mono)">${esc(date)}</span>

          ${TRUST_LEVEL >= 2 ? `<button class="btn-icon danger" data-delete-match="${esc(m.id)}" title="Remove match" style="font-size:13px;padding:4px 8px">✕</button>` : ''}
        </div>
      </div>
      ${m.roundScore ? `
      <div style="display:flex;justify-content:center;align-items:center;gap:0;margin-bottom:12px">
        <div style="text-align:right;flex:1">
          <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#4299E1;margin-bottom:2px">${esc(teamLabel(ctPs,"Team 1"))}</div>
        </div>
        <div style="padding:4px 18px;background:var(--bg3);border-radius:10px;margin:0 12px;text-align:center;min-width:80px">
          <div style="font-size:28px;font-weight:800;color:var(--text);font-family:var(--mono);letter-spacing:4px">
            ${m.roundScore.ct} <span style="color:var(--muted);font-size:16px">:</span> ${m.roundScore.t}
          </div>
        </div>
        <div style="text-align:left;flex:1">
          <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#e53e3e;margin-bottom:2px">${esc(teamLabel(tPs,"Team 2"))}</div>
        </div>
      </div>` : ''}
      <div class="hist-teams">
        ${sideHTML("ct", teamLabel(ctPs,"Team 1"), "#4299E1", ctPs)}
        ${sideHTML("t",  teamLabel(tPs, "Team 2"), "#e53e3e", tPs)}
      </div>
    </div>`;
  }).join('');

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div style="font-size:18px;font-weight:700;color:var(--text)">MATCH HISTORY</div>
    ${TRUST_LEVEL >= 1 ? `<button class="btn btn-ghost" id="bulk-import-btn" style="border-color:#f84982;color:#f84982;gap:8px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#f84982"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      IMPORT PAST MATCHES
    </button>` : ''}
  </div>
  <div id="history-list">${cards}</div>`;
}

function deleteMatch(matchId) {
  const m = state.matches.find(x=>x.id===matchId);
  if (!m) return;
  // Reverse ELO deltas for all players in this match
  state.players.forEach(p => {
    const entry = (p.matchHistory||[]).find(h=>h.matchId===matchId);
    if (!entry) return;
    p.elo = Math.max(0, (p.elo ?? 1000) - (entry.eloDelta ?? 0));
    p.matchHistory = p.matchHistory.filter(h=>h.matchId!==matchId);
    // Re-seed mu/sigma from scratch based on remaining history
    delete p.mu; delete p.sigma;
    const { mu, sigma } = tsInit(p);
    p.mu = mu; p.sigma = sigma;
  });
  state.matches = state.matches.filter(x=>x.id!==matchId);
  saveData();
  render();
  flash(`Match removed and ratings reversed`);
}

function bindHistory() {
  document.getElementById("history-list")?.addEventListener("click", e => {
    const pid = e.target.closest("[data-player-profile]")?.dataset.playerProfile;
    if (pid) { openPlayerProfile(pid); return; }
    const aid = e.target.closest("[data-awards]")?.dataset.awards;
    if (aid) { openMatchAwards(aid); return; }
    const mid = e.target.closest("[data-delete-match]")?.dataset.deleteMatch;
    if (mid) {
      const m = state.matches.find(x=>x.id===mid);
      const winPs = m ? (m.winner==="ct" ? m.teams.ct : m.teams.t).map(id=>state.players.find(p=>p.id===id)).filter(Boolean) : [];
      const label = m ? `${m.map} (${teamLabel(winPs,"Team 1")} WIN)` : "this match";
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.style.zIndex = "99999";
      overlay.innerHTML = `
        <div class="modal-box" style="width:min(380px,95vw)">
          <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px">Remove Match</div>
          <div style="font-size:14px;color:var(--muted);margin-bottom:20px">
            Remove <b style="color:var(--text)">${esc(label)}</b>?<br>
            <span style="font-size:12px">This will reverse all ELO changes from this match.</span>
          </div>
          <div style="display:flex;gap:10px">

            <button class="btn btn-primary" style="flex:1;background:#e53e3e" id="del-match-confirm">Remove</button>
          </div>

      document.body.appendChild(overlay);
      document.getElementById("del-match-cancel").addEventListener("click", () => overlay.remove());
      document.getElementById("del-match-confirm").addEventListener("click", () => { overlay.remove(); deleteMatch(mid); });
