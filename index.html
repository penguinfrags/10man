      <svg width="13" height="13" viewBox="0 0 24 24" fill="#f84982"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      IMPORT PAST MATCHES
    </button>` : ''}
  </div>
  <div id="history-list">${cards}</div>`;
}

function deleteMatch(matchId) {
  const m = state.matches.find(x=>x.id===matchId);
  if (!m) return;
  // Reverse ELO deltas for all players in this match
  state.players.forEach(p => {
    const entry = (p.matchHistory||[]).find(h=>h.matchId===matchId);
    if (!entry) return;
    p.elo = Math.max(0, (p.elo ?? 1000) - (entry.eloDelta ?? 0));
    p.matchHistory = p.matchHistory.filter(h=>h.matchId!==matchId);
  });
  state.matches = state.matches.filter(x=>x.id!==matchId);
  saveData();
  render();
  flash(`Match removed and ratings reversed`);
}

function bindHistory() {
  document.getElementById("history-list")?.addEventListener("click", e => {
    const pid = e.target.closest("[data-player-profile]")?.dataset.playerProfile;
    if (pid) { openPlayerProfile(pid); return; }
    const mid = e.target.closest("[data-delete-match]")?.dataset.deleteMatch;
    if (mid) {
      const m = state.matches.find(x=>x.id===mid);
      const winPs  = m ? (m.winner==="ct" ? m.teams.ct : m.teams.t).map(id=>state.players.find(p=>p.id===id)).filter(Boolean) : [];
      const label  = m ? `${m.map} (${teamLabel(winPs,"Team 1")} WIN)` : "this match";
      if (confirm(`Remove ${label}?\n\nThis will reverse all rating changes from this match.`)) {
        deleteMatch(mid);
      }
    }
  });
  document.getElementById("bulk-import-btn")?.addEventListener("click", openBulkImport);
}

// ─── Bulk Leetify import ──────────────────────────────────────────────────
function openBulkImport() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "bulk-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(560px,95vw)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <h3 style="color:var(--text);font-size:16px">Import Past Matches from Leetify</h3>
      </div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6">
        Paste one Leetify match URL per line. Each match will be fetched, players auto-matched to your roster by name and aliases, and you can confirm or adjust each before saving.
      </p>
      <textarea id="bulk-urls" rows="6" placeholder="https://leetify.com/app/match-details/xxxxxxxx-.../overview&#10;https://leetify.com/app/match-details/yyyyyyyy-.../overview"
        style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px;color:var(--text);font-family:var(--mono);font-size:12px;resize:vertical;margin-bottom:12px"></textarea>
      <div id="bulk-status" style="font-size:12px;color:var(--muted);min-height:18px;margin-bottom:12px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="bulk-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2;background:#f84982;border:none" id="bulk-fetch">FETCH MATCHES</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const setStatus = (msg, color="var(--muted)") => {
    const el = document.getElementById("bulk-status");
    if (el) { el.textContent = msg; el.style.color = color; }
  };

  overlay.addEventListener("click", e => { if(e.target===overlay) overlay.remove(); });
  document.getElementById("bulk-cancel").addEventListener("click", () => overlay.remove());

  document.getElementById("bulk-fetch").addEventListener("click", async () => {
    const raw = document.getElementById("bulk-urls").value.trim();
    const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
    const gameIds = [];
    for (const line of lines) {
      const m = line.match(/match-details\/([0-9a-f-]{36})/i);
      if (m) gameIds.push(m[1]);
    }
    if (!gameIds.length) { setStatus("No valid Leetify match URLs found.", "#e53e3e"); return; }

    document.getElementById("bulk-fetch").disabled = true;
    setStatus(`Fetching ${gameIds.length} match${gameIds.length>1?"es":""}…`);

    const results = [];
    for (let i = 0; i < gameIds.length; i++) {
      setStatus(`Fetching match ${i+1} of ${gameIds.length}…`);
      try {
        const res = await fetch(`https://api.cs-prod.leetify.com/api/games/${gameIds[i]}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        results.push({ gameId: gameIds[i], data, error: null });
      } catch(err) {
        results.push({ gameId: gameIds[i], data: null, error: err.message });
      }
    }

    const ok  = results.filter(r=>r.data);
    const bad = results.filter(r=>r.error);
    overlay.remove();

    if (!ok.length) {
      flash(`All ${bad.length} fetches failed — check match URLs and privacy settings`);
      return;
    }
    if (bad.length) flash(`${bad.length} match(es) failed to fetch — skipped`);

    openBulkMapping(ok.map(r=>r.data));
  });
}

function openBulkMapping(matchDataList) {
  // similarity scorer (same as single import)
  const similarity = (a, b) => {
    a = a.toLowerCase().replace(/[^a-z0-9]/g, "");
    b = b.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!a || !b) return 0;
    if (a === b) return 1;
    if (a.includes(b) || b.includes(a)) return 0.8;
    let matches = 0;
    for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) matches++;
    return matches / Math.max(a.length, b.length);
  };

  const findBestPlayer = (steamName) => {
    let bestId = "", bestScore = -1;
    state.players.forEach(p => {
      const candidates = [p.name, ...(p.aliases||[])];
      const score = Math.max(...candidates.map(n => similarity(steamName, n)));
      if (score > bestScore) { bestScore = score; bestId = p.id; }
    });
    return bestScore > 0.3 ? bestId : "";
  };

  // Build a list of matches with their extracted player stats
  const parsedMatches = matchDataList.map(data => {
    console.log("[Leetify bulk] raw top-level keys:", Object.keys(data));
    const rawStats = data.playerStats || data.stats || data.players || [];
    if (rawStats.length) console.log("[Leetify bulk] first player raw:", JSON.stringify(rawStats[0]).slice(0,400));
    const map = data.mapName || data.map_name || data.map || "Unknown";
    const playedAt = data.finishedAt || data.finished_at || data.createdAt || Date.now();
    // figure out winner from team_scores
    // Winner: group players by initialTeamNumber, sum their total rounds won.
    // Each player reports the same value for their team so one per team is enough.
    // Team with more total rounds (ctRoundsWon + tRoundsWon) wins.
    let winner = "ct"; // "ct" = team2 won, "t" = team3 won (internal labels only)
    const ps2 = data.playerStats || data.stats || [];
    if (ps2.length) {
      const team2p = ps2.find(s => (s.initialTeamNumber ?? s.teamNumber) === 2);
      const team3p = ps2.find(s => (s.initialTeamNumber ?? s.teamNumber) === 3);
      if (team2p && team3p) {
        const team2wins = (team2p.ctRoundsWon||0) + (team2p.tRoundsWon||0);
        const team3wins = (team3p.ctRoundsWon||0) + (team3p.tRoundsWon||0);
        winner = team2wins > team3wins ? "ct" : "t";
        console.log("[Leetify] team2 totalWins:", team2wins, "team3 totalWins:", team3wins, "-> winner:", winner==="ct"?"team2":"team3");
      }
    }
    const players = rawStats.map(s => {
      const name    = s.name || s.player_name || s.steam_name || s.steamName || s.nickname || "Unknown";
      const kills   = s.totalKills   ?? s.total_kills   ?? s.kills   ?? 0;
      const deaths  = s.totalDeaths  ?? s.total_deaths  ?? s.deaths  ?? 0;
      const assists = s.totalAssists ?? s.total_assists ?? s.assists ?? 0;
      const damage  = s.totalDamage  ?? s.total_damage  ?? s.damage  ?? 0;
      const leetifyRating = s.leetifyRating ?? s.leetify_rating ?? null;
      // initialTeamNumber: 3 = CT, 2 = T (confirmed from Leetify API)
      const teamNum = s.initialTeamNumber ?? s.teamNumber ?? s.team_number ?? null;
      const side    = teamNum === 2 ? "ct" : teamNum === 3 ? "t" : null;
      console.log("[Leetify bulk] player", name, "initialTeamNumber:", teamNum, "->", side);
      return { name, kills, deaths, assists, damage, leetifyRating, teamNum, side, suggestedId: findBestPlayer(name) };
    });
    // Derive round score: each team's total rounds won
    const team2p = ps2.find ? ps2.find(s=>(s.initialTeamNumber??s.teamNumber)===2) : null;
    const team3p = ps2.find ? ps2.find(s=>(s.initialTeamNumber??s.teamNumber)===3) : null;
    const team2wins = team2p ? (team2p.ctRoundsWon||0)+(team2p.tRoundsWon||0) : null;
    const team3wins = team3p ? (team3p.ctRoundsWon||0)+(team3p.tRoundsWon||0) : null;
    // ct bucket = team2, t bucket = team3
    const roundScore = (team2wins !== null && team3wins !== null)
      ? { ct: team2wins, t: team3wins } : null;
    return { map, playedAt: new Date(playedAt).getTime() || Date.now(), winner, players, gameId: data.id || data.gameId || "", roundScore };
  });

  // Render one accordion section per match
  const matchSections = parsedMatches.map((m, mi) => {
    const date = new Date(m.playedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    const rows = m.players.map((lp, pi) => {
      const autoSide = lp.side || "ct";
      return `
      <div style="display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:8px;margin-bottom:7px">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text)">${esc(lp.name)}</div>
          <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">${lp.kills}/${lp.deaths}/${lp.assists}</div>
        </div>
        <select data-match="${mi}" data-player="${pi}" data-side-select style="font-size:11px;width:100%;text-align:center">
          <option value="ct"${autoSide==="ct"?" selected":""}>Team 2</option>
          <option value="t"${autoSide==="t"?" selected":""}>Team 3</option>
          <option value="">skip</option>
        </select>
        <select data-match="${mi}" data-player="${pi}" data-roster-select style="font-size:12px;width:100%">
          <option value="">— skip —</option>
          ${state.players.map(p=>`<option value="${esc(p.id)}"${p.id===lp.suggestedId?" selected":""}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>`;
    }).join('');

    return `
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer" data-toggle-match="${mi}">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:8px;height:8px;border-radius:50%;background:${m.winner==='ct'?'#4299E1':'#e53e3e'}"></div>
          <span style="font-weight:700;color:var(--text);font-size:14px">${esc(m.map)}</span>
          <span style="font-size:11px;font-weight:700;color:${m.winner==='ct'?'#4299E1':'#e53e3e'}">${m.winner.toUpperCase()} WIN</span>
        </div>
        <span style="color:var(--muted);font-size:11px;font-family:var(--mono)">${esc(date)} ▾</span>
      </div>
      <div class="bulk-match-body" id="bulk-body-${mi}" style="padding:0 14px 12px;display:none">
        <div style="display:grid;grid-template-columns:1fr 80px 1fr;gap:8px;margin-bottom:6px;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted)">
          <div>LEETIFY PLAYER</div><div style="text-align:center">TEAM</div><div>ROSTER PLAYER</div>
        </div>
        ${rows}
      </div>
    </div>`;
  }).join('');

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box" style="width:min(580px,95vw)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f84982" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <h3 style="color:var(--text);font-size:16px">Review & Map Players — ${parsedMatches.length} match${parsedMatches.length>1?"es":""}</h3>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-bottom:14px">Click each match to expand and adjust player mappings. Players not in your roster can be skipped.</p>
      <div style="max-height:460px;overflow-y:auto;margin-bottom:14px">${matchSections}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="bulk-map-cancel">Cancel</button>
        <button class="btn btn-primary" style="flex:2;background:#f84982;border:none" id="bulk-map-confirm">IMPORT ALL MATCHES</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  // Toggle accordion
  overlay.addEventListener("click", e => {
    if (e.target===overlay) { overlay.remove(); return; }
    const toggleIdx = e.target.closest("[data-toggle-match]")?.dataset.toggleMatch;
    if (toggleIdx !== undefined) {
      const body = document.getElementById(`bulk-body-${toggleIdx}`);
      if (body) body.style.display = body.style.display==="none" ? "block" : "none";
    }
  });
  // Expand first match by default
  const first = document.getElementById("bulk-body-0");
  if (first) first.style.display = "block";

  document.getElementById("bulk-map-cancel").addEventListener("click", () => overlay.remove());

  document.getElementById("bulk-map-confirm").addEventListener("click", () => {
    let imported = 0, skipped = 0;

    // Collect both selects (side + roster) keyed by match+player
    const matchMaps = {};   // matchMaps[mi][pi] = { pid, side }
    overlay.querySelectorAll("select[data-roster-select]").forEach(sel => {
      const mi = parseInt(sel.dataset.match);
      const pi = parseInt(sel.dataset.player);
      const pid = sel.value;
      if (!matchMaps[mi]) matchMaps[mi] = {};
      matchMaps[mi][pi] = { pid: pid || "", side: "ct" };
    });
    overlay.querySelectorAll("select[data-side-select]").forEach(sel => {
      const mi = parseInt(sel.dataset.match);
      const pi = parseInt(sel.dataset.player);
      if (matchMaps[mi]?.[pi]) matchMaps[mi][pi].side = sel.value;
    });

    parsedMatches.forEach((m, mi) => {
      const mapping = matchMaps[mi] || {};
      const entries = Object.values(mapping).filter(e=>e.pid && e.side);
      if (!entries.length) { skipped++; return; }

      // Skip if this gameId already imported
      if (m.gameId && state.matches.some(x=>x.leetifyGameId===m.gameId)) { skipped++; return; }

      // Build teams directly from the explicit side dropdowns
      const ctIds = entries.filter(e=>e.side==="ct").map(e=>e.pid);
      const tIds  = entries.filter(e=>e.side==="t").map(e=>e.pid);

      const matchId = genId();
      const scores  = { ct: {}, t: {} };

      m.players.forEach((lp, pi) => {
        const entry = mapping[pi];
        if (!entry?.pid || !entry?.side || entry.side === "") return;
        scores[entry.side][entry.pid] = { kills: lp.kills, deaths: lp.deaths, assists: lp.assists, damage: lp.damage||0, leetifyRating: lp.leetifyRating??null };
      });

      // Run ELO adjustments
      const ctPlayers = ctIds.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
      const tPlayers  = tIds.map(id=>state.players.find(p=>p.id===id)).filter(Boolean);

      const processTeam = (team, opp, side) => {
        const oppAvgElo = opp.reduce((a,p)=>a+(p.elo??1000),0)/Math.max(opp.length,1);
        team.forEach(p => {
          const won      = m.winner===side;
          const s        = scores[side][p.id] || {kills:0,deaths:0,assists:0};
          const kd       = s.deaths>0 ? s.kills/s.deaths : s.kills;
          const curElo   = p.elo ?? 1000;
          const eloDelta = calcEloPoints(curElo, oppAvgElo, won, kd);
          const newElo   = Math.max(0, curElo + eloDelta);
          const idx = state.players.findIndex(x=>x.id===p.id);
          if (idx>-1) {
            state.players[idx].elo = newElo;
            // rating stays untouched
            state.players[idx].matchHistory = [
              ...(state.players[idx].matchHistory||[]),
              { matchId, won, kills:s.kills, deaths:s.deaths, assists:s.assists, damage:s.damage||0, leetifyRating:s.leetifyRating??null, eloDelta }
            ];
          }
        });
      };

      processTeam(ctPlayers, tPlayers, "ct");
      processTeam(tPlayers, ctPlayers, "t");

      state.matches.unshift({
        id: matchId,
        leetifyGameId: m.gameId,
        map: m.map,
        winner: m.winner,
        playedAt: m.playedAt,
        teams: { ct: ctIds, t: tIds },
        scores,
        roundScore: m.roundScore || null,
      });
      imported++;
    });

    saveData();
    overlay.remove();
    render();
    flash(`Imported ${imported} match${imported!==1?"es":""}${skipped?` · ${skipped} skipped`:""}`);
  });
}

// ─── Leaderboard ──────────────────────────────────────────────────────────
function playerLeaderboardStats(p) {
  const hist = p.matchHistory || [];
  const matches = hist.length;
  const wins    = hist.filter(m=>m.won).length;
  const kills   = hist.reduce((s,m)=>s+(m.kills||0),0);
  const deaths  = hist.reduce((s,m)=>s+(m.deaths||0),0);
  const assists = hist.reduce((s,m)=>s+(m.assists||0),0);
  const damage  = hist.reduce((s,m)=>s+(m.damage||0), 0);
  const kd      = deaths > 0 ? kills/deaths : kills;
  const wr      = matches > 0 ? wins/matches : 0;
  const lrValues = hist.map(m=>m.leetifyRating).filter(v=>v!==null&&v!==undefined);
  const avgLR   = lrValues.length > 0 ? lrValues.reduce((a,b)=>a+b,0)/lrValues.length : null;
  const rounds  = hist.reduce((s,m)=>{
    const mr = state.matches.find(x=>x.id===m.matchId);
    return s + (mr?.roundScore ? (mr.roundScore.ct + mr.roundScore.t) : 0);
  }, 0);
  const adr     = rounds > 0 ? damage/rounds : 0;
  const kpr     = rounds > 0 ? kills/rounds : 0;
  return { matches, wins, kills, deaths, assists, kd, wr, kpr, adr, elo: p.elo??1000, rounds, avgLR };
}

function renderLeaderboard() {
  const categories = [
    { id:"lr",   label:"LEETIFY",  desc:"Average Leetify Rating (min 3 matches)",  fmt: s=>s.avgLR!=null?`${(s.avgLR*100)>=0?"+":""}${(s.avgLR*100).toFixed(2)}`:"—", val: s=>(s.avgLR??-99)*100, min:3 },
    { id:"adr",  label:"ADR",      desc:"Average damage per round (min 3 matches)",fmt: s=>s.adr.toFixed(1),           val: s=>s.adr,      min:3 },
    { id:"elo",  label:"ELO",      desc:"Performance-based ELO rating",          fmt: s=>`${s.elo}`,                   val: s=>s.elo,      min:1 },
    { id:"kd",   label:"K/D",      desc:"Kill/death ratio (min 3 matches)",      fmt: s=>s.kd.toFixed(2),              val: s=>s.kd,       min:3 },
    { id:"wr",   label:"WIN RATE", desc:"Win percentage (min 3 matches)",         fmt: s=>`${(s.wr*100).toFixed(1)}%`, val: s=>s.wr,       min:3 },
  ];

  const activeCat = state.lbCat || "lr";
  const cat = categories.find(c=>c.id===activeCat) || categories[0];

  const eligible = state.players
    .map(p => ({ p, s: playerLeaderboardStats(p) }))
    .filter(({s}) => s.matches >= cat.min)
    .sort((a,b) => cat.val(b.s) - cat.val(a.s));

  const rows = eligible.map(({p, s}, i) => {
    const isTop = i === 0;
    const medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
    const barPct = ((p.rating - 1) / 17 * 100).toFixed(1);
    const rc = rankColor(p.rating);
    const eloNet = s.elo - 1000;
    const eloColor = eloNet>=0?"#68D391":"#fc8181";
    return `
    <div style="display:grid;grid-template-columns:28px 36px 1fr auto auto;align-items:center;gap:12px;
      padding:12px 16px;background:${isTop?'var(--bg3)':'var(--bg2)'};
      border:1px solid ${isTop?'var(--border2)':'var(--border)'};
      border-radius:12px;margin-bottom:8px;cursor:pointer"
      data-player-profile="${esc(p.id)}">
      <div style="font-size:${medal?'18':'13'}px;text-align:center;color:var(--muted);font-weight:700">${medal||i+1}</div>
      <div style="width:36px;height:40px;flex-shrink:0">${rankBadgeSVG(p.rating,rc)}</div>
      <div>
        <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(p.name)}</div>
        <div style="margin-top:4px;height:3px;background:var(--bg4);border-radius:2px;overflow:hidden;max-width:200px">
          <div style="width:${barPct.toFixed(1)}%;height:100%;background:${rc};border-radius:2px;transition:width .3s"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">
          W/L ${s.wins}/${s.matches-s.wins} · K/D ${s.kd.toFixed(2)} · ELO <span style="color:${eloColor}">${s.elo}</span>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:800;color:${rc};font-family:var(--mono)">${cat.fmt(s)}</div>
        <div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px">${cat.label}</div>
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:right;min-width:48px">${s.matches} match${s.matches!==1?'es':''}</div>
    </div>`;
  }).join('') || `<div style="color:var(--muted);text-align:center;padding:40px 0;font-size:14px">No players with enough matches yet</div>`;

  const tabs = categories.map(c=>`
    <button class="lb-tab${c.id===activeCat?' lb-tab-active':''}" data-lb-cat="${c.id}"
      style="padding:8px 16px;background:${c.id===activeCat?'var(--bg3)':'transparent'};
      border:1px solid ${c.id===activeCat?'var(--border2)':'transparent'};
      border-radius:8px;color:${c.id===activeCat?'var(--text)':'var(--muted)'};
      font-family:var(--font);font-weight:700;font-size:12px;letter-spacing:1.5px;cursor:pointer;transition:all .15s">
      ${c.label}
    </button>`).join('');

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
    <div>
      <div style="font-size:18px;font-weight:700;color:var(--text)">LEADERBOARD</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">${cat.desc}</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${tabs}</div>
  </div>
  <div id="lb-list">${rows}</div>`;
}

function bindLeaderboard() {
  document.querySelectorAll("[data-lb-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.lbCat = btn.dataset.lbCat;
      render();
    });
  });
  document.getElementById("lb-list")?.addEventListener("click", e => {
    const pid = e.target.closest("[data-player-profile]")?.dataset.playerProfile;
    if (pid) openPlayerProfile(pid);
  });
}

// ─── Rankings tab ────────────────────────────────────────────────────────
function renderRankings() {
  const suggestions = getRankSuggestions();

  const suggRows = suggestions.length === 0 ? `
    <div class="empty-state" style="padding-top:40px">
      <span class="empty-icon">✅</span>
      <p>No adjustments needed yet</p>
      <small>Keep playing — suggestions appear when a player's ELO drifts significantly from their skill rating</small>
    </div>` : suggestions.map(s => `
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px">
      <div style="flex:1">
        <div style="font-size:16px;font-weight:700;color:var(--text)">${esc(s.name)}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:3px">${s.drift>0?"Overperforming":"Underperforming"} by <b style="color:${s.drift>0?'#68D391':'#fc8181'}">${Math.abs(Math.round(s.drift))} ELO</b></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-family:var(--mono)">
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:700;color:${rankColor(s.current)}">${s.current.toFixed(1)}</div>
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px">CURRENT</div>
        </div>
        <div style="font-size:22px;color:${s.up?'#68D391':'#fc8181'}">${s.up?"⬆":"⬇"}</div>
        <div style="text-align:center">
          <div style="font-size:18px;font-weight:800;color:${rankColor(s.suggested)}">${s.suggested.toFixed(1)}</div>
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px">SUGGESTED</div>
        </div>
      </div>
      ${READONLY ? `<div style="font-size:11px;color:var(--muted)">Admin only</div>` : `<button class="btn btn-ghost" data-apply-suggestion="${esc(s.id)}" data-suggested-rating="${s.suggested}"
        style="font-size:12px;padding:8px 14px;border-color:${s.up?'#68D391':'#fc8181'};color:${s.up?'#68D391':'#fc8181'}">
        APPLY
      </button>`}
    </div>`).join('');

  return `
  <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">RANK ADJUSTMENT SUGGESTIONS</div>
  <div style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6">
    Team balancing uses manually set skill ratings. ELO tracks performance over time and is used to suggest adjustments.
  </div>
  ${suggRows}`;
}

function bindRankings() {
  document.querySelectorAll("[data-apply-suggestion]").forEach(btn => {
    btn.addEventListener("click", () => {
      const pid = btn.dataset.applySuggestion;
      const newRating = parseFloat(btn.dataset.suggestedRating);
      const idx = state.players.findIndex(p=>p.id===pid);
      if (idx > -1) {
        const old = state.players[idx].rating;
        state.players[idx].rating = newRating;
        state.players[idx].elo = 1000;
        saveData(); render();
        flash(`${state.players[idx].name} rating ${old.toFixed(1)} → ${newRating.toFixed(1)} · ELO reset to 1000`);
      }
    });
  });
}

// ─── Nav wiring ────────────────────────────────────────────────────────────
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});

// ─── Boot ─────────────────────────────────────────────────────────────────
checkAdminSession();
(async () => {
  // loadData now: renders cached data instantly, fetches remote in background
  await loadData();
  render();
  updateAdminBadge();
})();
</script>
</body>
</html>
